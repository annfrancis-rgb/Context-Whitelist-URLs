<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="aiRA Settings — Context management and Whitelist URLs, an interactive prototype on the aiRA Design System v1.1.">
<title>aiRA Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── aiRA Design System v1.1, foundations.md values. Three stand-ins for tokens
      the published table does not print: --aira-bg-danger, --aira-bg-scrim and
      --avatar-grad. ─────────────────────────────────────────────────────────── */
.aira{
  --aira-bg-default:#FFFFFF; --aira-bg-subtle:#FBFCFD; --aira-bg-muted:#EEF1F4;
  --aira-bg-canvas:#F6F8FA; --aira-bg-elevated:#FFFFFF; --aira-bg-surface:#FFFFFF;
  --aira-bg-sunken:#EEF1F4;
  --aira-bg-inverse:#111827; --aira-bg-selected:#EEF0FF; --aira-bg-hover:#EEF1F4;
  --aira-bg-brand:#3438C9; --aira-bg-brand-hover:#252AA0;
  --aira-text-primary:#111827; --aira-text-secondary:#364152; --aira-text-tertiary:#6B7785;
  /* Placeholder text has its own token — the same value as disabled, two steps
     lighter than tertiary, which is what it had been wrongly painted with. */
  --aira-text-placeholder:#9AA4B2;
  --aira-text-link:#3438C9; --aira-text-inverse:#FFFFFF; --aira-text-disabled:#9AA4B2;
  --aira-text-danger:#D92D2D; --aira-text-success:#1F7A42; --aira-text-warning:#B97300;
  --aira-border-subtle:#EEF1F4; --aira-border-default:#E2E6EB; --aira-border-strong:#C9D0D9;
  --aira-border-brand:#3438C9; --aira-border-focus:#3438C9;
  --aira-radius-xs:4px; --aira-radius-sm:6px; --aira-radius-md:8px; --aira-radius-lg:12px;
  --aira-radius-xl:16px; --aira-radius-2xl:20px; --aira-radius-pill:999px;
  --aira-radius-circle:50%;
  --aira-shadow-sm:0 1px 3px rgba(17,24,39,.08);
  --aira-shadow-md:0 4px 12px rgba(17,24,39,.10);
  --aira-shadow-lg:0 8px 24px rgba(17,24,39,.16);
  --aira-motion-fast:120ms; --aira-motion-base:200ms; --aira-motion-slow:320ms;
  /* White on --aira-bg-danger measures 4.81:1, which clears AA for the
     destructive modal's primary. Status surfaces are painted on licensed
     neutrals rather than on invented amber and red tints. */
  --aira-bg-danger:#D92D2D;
  /* Status surfaces, verbatim from the published token set. */
  --aira-status-warning-bg:#FFF6E0; --aira-status-warning-text:#8A5500;
  --aira-status-danger-bg:#FFECEC;  --aira-status-danger-text:#B11E1E;
  --aira-bg-scrim:rgba(17,24,39,0.45);
  --aira-brand-from:#6268FF; --aira-brand-to:#3BA7FF;
  --aira-avatar-grad:linear-gradient(135deg,var(--aira-brand-from),var(--aira-brand-to));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Single-theme on purpose: this has to be indistinguishable from the real aiRA
   product, which renders light. Every colour is painted explicitly so the page
   holds its own ground whatever theme the viewer is in. */
body{font:400 14px/20px Roboto,system-ui,sans-serif;background:var(--aira-bg-canvas);
  color:var(--aira-text-primary);overflow:hidden}
button,input,textarea{font-family:inherit}
/* position:relative so the drawer scrim, the modal scrim and the toast all
   resolve against the app box rather than the viewport — at 200% zoom the
   viewport is narrower than the app, and a viewport-sized scrim leaves part of
   the listing bright and undimmed beside an open dialog. */
#app{width:100%;height:100%;display:flex;min-width:1180px;position:relative}
/* Below the product's own minimum the window scrolls rather than clipping the
   screen away. This is a desktop settings surface; it does not reflow to a phone. */
@media (max-width:1180px){ body{overflow-x:auto} }

/* outline, never a box-shadow ring — a shadow ring merges into a card's own shadow. */
.aira [data-fk]:focus-visible{outline:2px solid var(--aira-border-focus);outline-offset:2px;
  border-radius:var(--aira-radius-xs)}
/* The bordered wrapper IS the field; the input is the text inside it, so the ring
   goes round the whole control rather than round the caret's box. */
.aira .qwrap:focus-within{outline:2px solid var(--aira-border-focus);outline-offset:2px}
.aira .qbox:focus-visible,.aira .tbox:focus-visible{outline:none}
.qbox::placeholder,.tbox::placeholder{color:var(--aira-text-placeholder);opacity:1}
.aira .tbox{resize:vertical}

/* Thumb only, no track — the aiRA scrollbar treatment. */
.scroller::-webkit-scrollbar{width:6px;height:6px}
.scroller::-webkit-scrollbar-track{background:transparent}
.scroller::-webkit-scrollbar-thumb{background:var(--aira-border-strong);
  border-radius:var(--aira-radius-pill)}

.reset{all:unset;box-sizing:border-box;display:block;cursor:pointer}
.reset[disabled]{cursor:default}

/* In an open menu, hover wins: the selected row drops its fill the moment the
   pointer is in the list, so only one row is ever grey. The tick keeps saying
   which one is selected, because colour is never the only signal. */
.aira .mitem{transition:background var(--aira-motion-fast) ease-out}
.aira .mitem:hover{background:var(--aira-bg-hover)}
.aira .mitem.sel{background:var(--aira-bg-hover)}
.aira .menu:hover .mitem.sel{background:transparent}
.aira .menu:hover .mitem:hover{background:var(--aira-bg-hover)}
.aira .mitem[disabled]{color:var(--aira-text-disabled)}
.aira .mitem[disabled]:hover{background:transparent}

/* Hover lives in CSS: an inline style has no state. Each rule sits after .reset
   so it outranks the `all:unset` that would otherwise clear the background. */
.aira .hov{transition:background var(--aira-motion-fast) ease-out}
.aira .hov:hover{background:var(--aira-bg-hover)}
.aira .hov[disabled]:hover{background:transparent}
/* Hover belongs to the row, not to the name — this is the app listing page's
   behaviour copied exactly: class "hov" on the whole row, cursor:pointer, and
   a plain name with no colour change and no underline of its own.
   --aira-text-tertiary measures 4.02:1 on --aira-bg-hover, under the 4.5:1 AA
   floor, so quiet text steps up to secondary (9.1:1) for as long as the row is
   hovered. Nothing else in the row is tertiary. */
.aira .hov:hover .quiet{color:var(--aira-text-secondary)}
.aira .dplink:hover{text-decoration:underline}

/* AiraTooltip. A `title` attribute fires on hover and never on keyboard focus,
   which is the one case that matters here: the name is the row's affordance and
   it is the thing being truncated. */
.aira [data-tip]::after{content:attr(data-tip);position:absolute;left:0;top:100%;
  margin-top:4px;z-index:6;white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity var(--aira-motion-fast) ease-out;
  font:400 13px/20px Roboto,system-ui,sans-serif;color:var(--aira-text-inverse);
  background:var(--aira-bg-inverse);border-radius:var(--aira-radius-sm);
  padding:4px 8px;box-shadow:var(--aira-shadow-md)}
.aira [data-tip]:hover::after,.aira [data-tip]:focus-visible::after{opacity:1}
@media (prefers-reduced-motion:reduce){ .aira [data-tip]::after{transition:none} }

/* Under reduced motion animation halts, it does not accelerate. */
@media (prefers-reduced-motion:reduce){
  .aira .hov,.aira .mitem{transition:none}
  .aira .spin{animation:none}
}
.aira .spin{animation:sp 800ms linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── prototype controls ──────────────────────────────────────────────────────
   Plainly not part of the product: one strip in the shell's own neutral rather
   than an aiRA token, so nobody can mistake it for a feature. Centred on the top
   edge, in the empty middle of the org header — the only band of the window that
   holds nothing at any width, and clear of the drawer's footer buttons. */
#proto{position:fixed;left:50%;transform:translateX(-50%);top:7px;z-index:40;
  display:flex;flex-wrap:nowrap;align-items:center;max-width:calc(100vw - 32px);
  gap:6px;padding:6px 10px;border-radius:999px;background:rgba(17,24,39,.94);
  box-shadow:0 8px 24px rgba(17,24,39,.24)}
#proto .plabel{font:600 11px/16px Roboto,system-ui,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:#9AA4B2;padding:0 4px;flex:none}
#proto .pnote{font:400 12px/16px Roboto,system-ui,sans-serif;color:#8B95A5;
  padding:0 6px;flex:none;white-space:nowrap}
#proto button{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;
  font:400 13px/20px Roboto,system-ui,sans-serif;color:#C8CFDB;
  padding:5px 10px;border-radius:999px;transition:background 120ms ease-out}
#proto button:hover{background:rgba(255,255,255,.10);color:#F4F6FA}
#proto button[aria-pressed="true"]{background:#F4F6FA;color:#111827}
#proto button:focus-visible{outline:2px solid #8E97FF;outline-offset:2px}
#proto .psep{width:1px;height:20px;flex:none;background:rgba(255,255,255,.16);margin:0 2px}
@media (prefers-reduced-motion:reduce){ #proto button{transition:none} }
</style>
</head>
<body>
<div id="app" class="aira"></div>
<div id="proto"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   aiRA Settings → Context management.
   A working screen, not a slide deck: one state object, one render, and every
   state reached the way a real user would reach it. aiRA Design System v1.1
   throughout — every size below is a published row of the type ramp, every
   colour and space a token.
   ═══════════════════════════════════════════════════════════════════════════ */

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── the type ramp — foundations.md, verbatim. Roboto ships 400/500/600 and
      nothing else, and every pair below is a published row. Anything not on
      this list does not get written. ─────────────────────────────────────── */
const F = {
  /* Tracking is part of the published token for every row above H3. */
  displayMd:'font:600 32px/40px Roboto,system-ui,sans-serif;letter-spacing:-0.015em',
  h1:    'font:600 28px/36px Roboto,system-ui,sans-serif;letter-spacing:-0.01em',
  h2:    'font:600 22px/30px Roboto,system-ui,sans-serif;letter-spacing:-0.005em',
  h3:    'font:600 18px/26px Roboto,system-ui,sans-serif',     /* Heading 3  */
  h4:    'font:600 16px/24px Roboto,system-ui,sans-serif',     /* Heading 4  */
  bodyLg:'font:400 16px/26px Roboto,system-ui,sans-serif',     /* Body lg    */
  body:  'font:400 14px/22px Roboto,system-ui,sans-serif',     /* Body md    */
  bodySm:'font:400 13px/20px Roboto,system-ui,sans-serif',     /* Body sm    */
  lblLg: 'font:500 15px/22px Roboto,system-ui,sans-serif',     /* Label lg   */
  lblMd: 'font:500 14px/20px Roboto,system-ui,sans-serif',     /* Label md   */
  lblSm: 'font:500 12px/16px Roboto,system-ui,sans-serif',     /* Label sm   */
  over:  'font:500 11px/16px Roboto,system-ui,sans-serif;letter-spacing:0.08em',
  /* Code takes Body sm's metrics so a JSON block sits on the same baseline grid
     as the prose around it; only the family changes. */
  mono:  'font:400 13px/20px Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums',
};
const semi = e => (e && !e.trim().endsWith(';') ? ';' : '');
const row    = (g, x='') => `display:flex;align-items:center;gap:${g}px;${x}${semi(x)}`;
const rowTop = (g, x='') => `display:flex;align-items:flex-start;gap:${g}px;${x}${semi(x)}`;
const col    = (g, x='') => `display:flex;flex-direction:column;gap:${g}px;${x}${semi(x)}`;
const tab    = 'font-variant-numeric:tabular-nums';
const ellip  = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';

/* ── icons — lucide, strokeWidth 1.5, currentColor, sizes 14/16/20 only.
      Every glyph is aria-hidden: it is either decorative beside text, or inside
      a button that carries its own accessible name. ──────────────────────── */
const ic = (d, s=20) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" `
  + `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" `
  + `style="flex:none">${d}</svg>`;
const I = {
  /* Real lucide geometry, not approximations. strokeWidth 1.5 and currentColor
     come from ic(), so every glyph inherits the weight and the text colour of
     whatever it sits in. */
  chevronDown:  s => ic('<path d="m6 9 6 6 6-6"/>', s),
  chevronRight: s => ic('<path d="m9 18 6-6-6-6"/>', s),
  chevronLeft:  s => ic('<path d="m15 18-6-6 6-6"/>', s),
  calendar:     s => ic('<path d="M8 2v4"/><path d="M16 2v4"/>'
                      + '<rect width="18" height="18" x="3" y="4" rx="2"/>'
                      + '<path d="M3 10h18"/>', s),
  x:            s => ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', s),
  ellipsis:     s => ic('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
                      + '<circle cx="5" cy="12" r="1"/>', s),
  plus:         s => ic('<path d="M5 12h14"/><path d="M12 5v14"/>', s),
  search:       s => ic('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', s),
  eye:          s => ic('<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 '
                      + '1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>'
                      + '<circle cx="12" cy="12" r="3"/>', s),
  /* lucide square-pen — the conventional "edit this record" affordance. */
  squarePen:    s => ic('<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>'
                      + '<path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505'
                      + 'l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>', s),
  trash:        s => ic('<path d="M3 6h18"/>'
                      + '<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>'
                      + '<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'
                      + '<line x1="10" x2="10" y1="11" y2="17"/>'
                      + '<line x1="14" x2="14" y1="11" y2="17"/>', s),
  download:     s => ic('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>'
                      + '<polyline points="7 10 12 15 17 10"/>'
                      + '<line x1="12" x2="12" y1="15" y2="3"/>', s),
  paperclip:    s => ic('<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57'
                      + 'A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>', s),
  archive:      s => ic('<rect width="20" height="5" x="2" y="3" rx="1"/>'
                      + '<path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>'
                      + '<path d="M10 12h4"/>', s),
  archiveRestore: s => ic('<rect width="20" height="5" x="2" y="3" rx="1"/>'
                      + '<path d="M4 8v11a2 2 0 0 0 2 2h2"/>'
                      + '<path d="M20 8v11a2 2 0 0 1-2 2h-2"/>'
                      + '<path d="m9 15 3-3 3 3"/><path d="M12 12v9"/>', s),
  check:        s => ic('<path d="M20 6 9 17l-5-5"/>', s),
  circleCheck:  s => ic('<path d="M21.801 10A10 10 0 1 1 17 3.335"/>'
                      + '<path d="m9 11 3 3L22 4"/>', s),
  info:         s => ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/>'
                      + '<path d="M12 8h.01"/>', s),
  triangleAlert: s => ic('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16'
                      + 'a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>', s),
  circleAlert:  s => ic('<circle cx="12" cy="12" r="10"/>'
                      + '<line x1="12" x2="12" y1="8" y2="12"/>'
                      + '<line x1="12" x2="12.01" y1="16" y2="16"/>', s),
  keyRound:     s => ic('<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3'
                      + 'a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172'
                      + 'a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/>'
                      + '<circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>', s),
  lock:         s => ic('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>'
                      + '<path d="M7 11V7a5 5 0 0 1 10 0v4"/>', s),
  braces:       s => ic('<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5'
                      + 'c0 1.1.9 2 2 2h1"/>'
                      + '<path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5'
                      + 'a2 2 0 0 0-2-2h-1"/>', s),
  /* The sort mark from the app listing page, path for path: an up arrow and a
     down arrow side by side. Rotating it 180 degrees swaps which side each one
     is on, so the same glyph reads as flipped rather than replaced. */
  sortArrows:   s => ic('<path d="M8 4v16M8 4L5 7M8 4l3 3"/>'
                      + '<path d="M16 20V4M16 20l3-3M16 20l-3-3"/>', s),
  messageSquare: s => ic('<path d="M22 17a2 2 0 0 1-2 2H6l-4 4V5a2 2 0 0 1 2-2h16'
                      + 'a2 2 0 0 1 2 2z"/>', s),
  loader:       s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"`
                      + ` stroke="currentColor" stroke-width="1.5" stroke-linecap="round"`
                      + ` class="spin" aria-hidden="true" style="flex:none">`
                      + `<path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`,
  /* ── rich-text toolbar, all lucide ─────────────────────────────────────── */
  bold:         s => ic('<path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7'
                      + 'a4 4 0 0 1 0 8"/>', s),
  italic:       s => ic('<line x1="19" x2="10" y1="4" y2="4"/>'
                      + '<line x1="14" x2="5" y1="20" y2="20"/>'
                      + '<line x1="15" x2="9" y1="4" y2="20"/>', s),
  underline:    s => ic('<path d="M6 4v6a6 6 0 0 0 12 0V4"/>'
                      + '<line x1="4" x2="20" y1="20" y2="20"/>', s),
  strikethrough: s => ic('<path d="M16 4H9a3 3 0 0 0-2.83 4"/>'
                      + '<path d="M14 12a4 4 0 0 1 0 8H6"/>'
                      + '<line x1="4" x2="20" y1="12" y2="12"/>', s),
  heading1:     s => ic('<path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/>'
                      + '<path d="m17 12 3-2v8"/>', s),
  heading2:     s => ic('<path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/>'
                      + '<path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/>', s),
  heading3:     s => ic('<path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/>'
                      + '<path d="M17.5 10.5c1.7-1 3.5 0 3.5 1.5a2 2 0 0 1-2 2"/>'
                      + '<path d="M17 17.5c2 1.5 4 .3 4-1.5a2 2 0 0 0-2-2"/>', s),
  list:         s => ic('<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/>'
                      + '<path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>', s),
  listOrdered:  s => ic('<path d="M10 12h11"/><path d="M10 18h11"/><path d="M10 6h11"/>'
                      + '<path d="M4 10h2"/><path d="M4 6h1v4"/>'
                      + '<path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>', s),
  quote:        s => ic('<path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1'
                      + 'a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5'
                      + 'a2 2 0 0 0-2-2z"/>'
                      + '<path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1'
                      + 'a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5'
                      + 'a2 2 0 0 0-2-2z"/>', s),
  link:         s => ic('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>'
                      + '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>', s),
  unlink:       s => ic('<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07'
                      + ' 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>'
                      + '<path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07'
                      + ' 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/>'
                      + '<line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/>'
                      + '<line x1="16" x2="16" y1="19" y2="22"/>'
                      + '<line x1="19" x2="22" y1="16" y2="16"/>', s),
  code:         s => ic('<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>', s),
  table:        s => ic('<path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/>'
                      + '<path d="M3 9h18"/><path d="M3 15h18"/>', s),
  alignLeft:    s => ic('<line x1="21" x2="3" y1="6" y2="6"/>'
                      + '<line x1="15" x2="3" y1="12" y2="12"/>'

/* The drawer body scrolls, so a popover opening downward from a trigger near the
   bottom is clipped by the scroller rather than overflowing it. How much room is
   left is not knowable while the string is being built, so this runs after the
   render — and after restoreScroll, which would otherwise undo the scroll below. */
function placeDatePicker() {
  const pop = document.getElementById('dppop');
  const box = document.getElementById('dscroll');
  if (!pop || !box) return;
  const trig = pop.previousElementSibling;
  const b = box.getBoundingClientRect(), t = trig.getBoundingClientRect();
  const h = pop.offsetHeight + 8;
  if (b.bottom - t.bottom >= h) return;                       // room below: as built
  if (t.top - b.top >= h) {                                   // room above: flip
    pop.style.top = 'auto'; pop.style.bottom = 'calc(100% + 4px)'; return;
  }
  /* Neither side fits on a short window, so the trigger comes to the top of the
     drawer and the calendar opens downward into the room that makes. */
  box.scrollTop += (t.top - b.top) - 8;
  S.drawerScroll = box.scrollTop;
}
function sizeGuttersFor(id, FIXED_COLS, NAME_TARGET) {
  const el = document.getElementById(id);
  if (!el) return;
  const avail = el.clientWidth - CELL * 2;
  /* Clamped at both ends: below 24 the columns run together, and above 48 a
     wide window turns the gutters into canyons. Past the ceiling the extra
     goes to Name, which is the primary column and the one that earns it. */
  const g = Math.min(GUTTER_MAX, Math.max(GUTTER_MIN,
    Math.floor((avail - FIXED_COLS - NAME_TARGET) / 16) * 4));
  el.style.setProperty('--gut', g + 'px');
}
addEventListener('resize', sizeGutters);

const SCOPES = [['all','All contexts'], ['org','Org'], ['user','User']];
const STATUSES = [['active','Active'], ['archived','Archived'], ['all','All']];
const labelOf = (opts, v) => (opts.find(o => o[0] === v) || opts[0])[1];

/* AiraDropdown, single choice. The popover hangs off its own trigger, so neither
   has to know where on the row it sits or how wide the label happens to be. */
function dropdown(opts, key, sel) {
  const open = S.menu === '__' + key;
  return `<span style="position:relative;display:inline-flex;flex:none">`
    + `<button class="reset hov" aria-haspopup="listbox" aria-expanded="${open}" `
    + `style="${row(8,'height:36px;border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);padding:0 12px 0 16px;' + F.body
        + ';color:var(--aira-text-secondary);white-space:nowrap')}"`
    + named(labelOf(opts, sel) + ' filter', key) + `>${esc(labelOf(opts, sel))}`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.chevronDown(14)}</span></button>`
    + (open
      ? `<div class="menu" role="listbox" style="${col(0,'position:absolute;left:0;'
          + 'top:calc(100% + 4px);min-width:100%;width:216px;background:var(--aira-bg-elevated);'
          + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
          + 'box-shadow:var(--aira-shadow-lg);padding:8px;z-index:4')}">`
        + opts.map(([k, t]) => `<button class="reset mitem${k === sel ? ' sel' : ''}" `
          + `role="option" aria-selected="${k === sel}" style="${row(8,'padding:8px 12px;'
            + 'border-radius:var(--aira-radius-xs);' + F.body + ';color:var(--aira-text-secondary);'
            + 'white-space:nowrap')}"`
          + live(key + ':' + k) + `>`
          + `<span style="flex:1;min-width:0;text-align:left">${esc(t)}</span>`
          + (k === sel ? `<span style="flex:none;display:flex;color:var(--aira-text-link)">`
              + I.check(16) + `</span>` : '') + `</button>`).join('')
        + `</div>`
      : '')
    + `</span>`;
}

/* Every filter can empty the list, so the list owes the reader a reason and a way
   out. Four causes, four answers — a single "nothing here" would make a failed
   search look the same as an empty org. */
/* One line, and the same line wherever a reader meets an empty list: what a
   context is, and what having one gets you. */
const WHAT_CONTEXT_IS =
  'Tell aiRA what it should know about your business — brand facts, data rules, '
  + 'naming conventions — and it uses them in every answer.';

function emptyState() {
  const q = S.query.trim();
  let title, body, cta = null;
  if (q) {
    title = 'No contexts match your search';
    body  = 'No context name or author email contains “' + q + '”. '
          + 'Try a shorter word, or clear the search.';
  } else if (S.status === 'archived') {
    title = 'No archived contexts';
    body  = 'Archive a context from its actions menu to keep it out of '
          + 'aiRA\u2019s reading without losing it.';
    cta   = null;
  } else if (S.scope === 'user') {
    title = 'No contexts of your own';
    body  = WHAT_CONTEXT_IS; cta = 'Add context';
  } else if (CTX.filter(visibleTo).length === 0) {
    title = 'No contexts yet';
    body  = WHAT_CONTEXT_IS; cta = 'Add context';
  } else {
    title = 'No contexts in this view';
    body  = 'Nothing matches this filter. Try All contexts.';
  }
  return `<div style="${col(8,'flex-grow:1;align-items:center;justify-content:center;'
      + 'padding:64px 24px;text-align:center')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(20)}</span>`
    + `<span style="${F.h4};color:var(--aira-text-primary)">${esc(title)}</span>`
    + `<span style="${F.bodySm};color:var(--aira-text-secondary);max-width:460px">`
    + `${esc(body)}</span>`
    + (cta ? `<span style="margin-top:8px">` + primaryBtn(cta, 'add', I.plus) + `</span>` : '')
    + `</div>`;
}

function listing() {
  const rows = visibleRows();

  /* Weight alone carries the hierarchy across the three data cells: Name and
     the date are Label md, the author is Body md, all on one ink. Stacking a
     colour split on top of the weight split would be two mechanisms for one
     distinction. */
  const person = e => `<span title="${esc(e)}" style="${F.body};`
    + `color:var(--aira-text-primary);display:block;${ellip}">${esc(e)}</span>`;

  /* The row is a plain container. The open affordance is a real button on the
     name, so the row's accessible name is the context name alone and the actions
     button is its sibling rather than a button inside a button. */
  const ctxRow = (c, i, total) => {
    const on = S.drawer && S.drawer.id === c.id;
    return `<div class="hov"`
      + live('open:' + c.id)
      + ` style="${row(0,`padding:12px ${CELL}px;cursor:pointer;`
        + 'border-bottom:1px solid var(--aira-border-subtle);'
        + (on ? 'background:var(--aira-bg-selected);' : ''))}">`
      /* Every cell is a single line except Modified on, and the row centres
         them against it, so nothing floats above an empty half-cell. */
      + `<div style="${row(8,COLS.name.cell)}">`
      /* 36px of target inside a 20px line box: the padding makes the hit area,
         the matching negative margin keeps the row's rhythm. The full name is
         exposed on focus as well as hover — a title attribute never reaches a
         keyboard user, and truncation is exactly what makes it needed. */
      + `<button class="reset namebtn" data-tip="${esc(c.name)}" style="${F.lblMd};`
      /* flex:0 1 auto, not flex:1 — the button is the width of its own text and
         only shrinks when the row runs out of room. Growing it to fill the
         column pushed the scope pill back out to the column's right edge, which
         is the stranding this move was meant to end. */
      + `color:var(--aira-text-primary);${ellip};text-align:left;flex:0 1 auto;`
      + `min-width:0;padding:8px 0;margin:-8px 0;position:relative"`
      + live('open:' + c.id) + `>${esc(c.name)}</button>`
      + (S.status === 'all' && c.archived ? archivedChip() : '') + `</div>`
      + gutter
      + `<div style="${COLS.scope.cell}">${scopeTag(c.scope)}</div>`
      + gutter
      + `<div style="${COLS.by.cell}">${person(email(c.by))}</div>`
      + gutter
      /* Date takes the same Label md as the name above it and time the same
         Body sm tertiary as the line under the name — one pattern for a stacked
         cell, not two. */
      + `<div style="${col(0,COLS.on.cell)}">`
      + `<span style="${F.lblMd};color:var(--aira-text-primary);${tab}">${esc(c.date)}</span>`
      + `<span class="quiet" style="${F.bodySm};color:${on ? 'var(--aira-text-secondary)'
        : 'var(--aira-text-tertiary)'};${tab}">${esc(c.time)}</span>`
      + `</div>`
      + gutter
      + `<div style="${row(0,COLS.act.cell)}">`
      + `<span style="position:relative;display:flex;flex:none">`
      + `<button class="reset${S.menu === c.id ? '' : ' hov'}" aria-haspopup="menu" `
      + `aria-expanded="${S.menu === c.id}" `
      + `style="${row(0,'justify-content:center')}width:32px;height:32px;`
      + `margin:-6px -6px -6px -6px;`
      + `border-radius:var(--aira-radius-md);color:var(--aira-text-secondary);`
      + (S.menu === c.id ? 'background:var(--aira-bg-hover)' : '') + `"`
      + named('Actions for ' + c.name, 'more:' + c.id) + `>${I.ellipsis(20)}</button>`
      + rowMenu(c, i, total)
      + `</span></div></div>`;
  };

  /* The menu is built from what this reader can actually do. A member looking at
     an org context can read it and nothing else, so their menu holds one item —
     rather than four greyed ones, which reads as a fault rather than a boundary.
     It hangs off its own trigger, so it needs no row arithmetic, and it flips
     upward on the last rows rather than opening into the table's bottom edge. */
  function rowMenu(c, i, total) {
    if (S.menu !== c.id) return '';
    const items = [['View context', I.eye, 'view']];
    if (canEdit(c)) {
      if (c.archived) items.push(['Restore context', I.archiveRestore, 'restore']);
      else {
        items.push(['Edit context', I.squarePen, 'edit']);
        items.push(['Archive context', I.archive, 'archive']);
      }
    }
    const up = total > 4 && i >= total - 3;
    return `<div class="menu" role="menu" style="${col(0,'position:absolute;right:0;'
        + (up ? 'bottom:calc(100% + 4px);' : 'top:calc(100% + 4px);')
        + 'width:232px;background:var(--aira-bg-elevated);'
        + 'border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);box-shadow:var(--aira-shadow-lg);'
        + 'padding:8px;z-index:4')}">`
      + items.map(([t, g, act]) => `<button class="reset mitem" role="menuitem" `
          + `style="${row(12,'padding:8px 12px;border-radius:var(--aira-radius-xs);'
          + F.body + ';color:var(--aira-text-secondary)')}"`
        + live('mi:' + act + ':' + c.id) + `>${g(ICON_WITH_LABEL)}${esc(t)}</button>`).join('')
      + `</div>`;
  }

  /* Only the column the list is ordered by carries a sort mark; a mark on a
     column that does not sort is a false affordance. */
  /* One glyph, flipped — not a different shape per state. A shape that changes
     reads as a different control rather than the same one pointing the other
     way, and rotating makes the motion the answer. Tertiary, as the app listing
     page paints it: the mark is a quiet affordance beside the heading, not a
     highlight. A heading that does not sort carries no mark at all. */
  const sortMark = () =>
    `<span style="color:var(--aira-text-tertiary);display:flex;`
    + `transform:rotate(${S.sort === 'asc' ? 180 : 0}deg);`
    + `transition:transform var(--aira-motion-base) ease-out">`
    + I.sortArrows(16) + `</span>`;
  const hCell = (h, k, sorts) => {
    const cell = row(4, `${COLS[k].cell};white-space:nowrap;`
      + `color:var(--aira-text-primary);` + F.lblMd);
    if (!sorts) return `<div style="${cell}">${esc(h)}</div>`;
    return `<div role="columnheader" aria-sort="${
        S.sort === 'asc' ? 'ascending' : 'descending'}"`
      + ` style="${COLS[k].cell}">`
      + `<button class="reset" style="${row(4,'white-space:nowrap;'
        + 'color:var(--aira-text-primary);' + F.lblMd)}"`
      + ` title="Sort by ${esc(h.toLowerCase())}"` + live('sort')
      + `>${esc(h)}${sortMark()}</button></div>`;
  };
  const head = `<div style="${row(0,`padding:12px ${CELL}px;`
      + 'position:sticky;top:0;z-index:2;flex:none;'
      + 'background:var(--aira-bg-subtle);'
      + 'border-bottom:1px solid var(--aira-border-default)')}">`
    + hCell('Name', 'name', false) + gutter
    + hCell('Scope', 'scope', false) + gutter
    + hCell('Modified by', 'by', false) + gutter
    + hCell('Modified on', 'on', true) + gutter
    + `<div style="${row(0,`${COLS.act.cell};${F.lblMd};`
      + `color:var(--aira-text-primary)`)}">Actions</div></div>`;

  /* The count follows the filter. "7 contexts configured" while you are looking
     at the archived list says something untrue about what is on screen. */
  const countLabel = S.status === 'archived' ? plural(rows.length, 'archived context')
                   : plural(rows.length, 'context');

  return `<div style="${col(0,`flex-grow:1;min-height:0;`
      + `padding:24px ${INSET}px 32px`)}">`
    + `<div style="${row(0,'padding:0 0 20px')}">`
    + `<h1 style="${F.h2};color:var(--aira-text-primary);margin:0">Context management</h1>`
    + `<span style="flex-grow:1"></span>`
    + iconBtn('Close settings', 'closesettings', I.x, 'var(--aira-text-tertiary)')
    + `</div>`

    + `<div style="${row(12,'padding:0 0 16px')}">`
    + dropdown(SCOPES, 'scope', S.scope) + dropdown(STATUSES, 'status', S.status)
    + `<label class="qwrap" style="${row(8,'flex:1;max-width:360px;height:36px;'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
      + 'padding:0 12px;background:var(--aira-bg-elevated)')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(16)}</span>`
    + `<input class="qbox" id="qbox" type="text" value="${esc(S.query)}" `
    + `placeholder="Search contexts" aria-label="Search contexts" `
    + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;`
    + `padding:0;flex:1;min-width:0"` + live('q') + `></label>`
    + `<span style="flex-grow:1"></span>`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary);${tab}">${esc(countLabel)}</span>`
    + `<span style="width:8px"></span>`
    /* On an empty list the empty state carries the primary, so the filter bar
       drops its own — two identical primaries is a hierarchy that has not been
       decided. */
    + (rows.length ? primaryBtn('Add context', 'add', I.plus) : '')
    + `</div>`

    + `<div style="${col(0,'flex-grow:1;min-height:0;'
      + 'border-top:1px solid var(--aira-border-default)')}">`
    + `<div class="scroller" id="ctxtable" `
    + `style="${col(0,'flex-grow:1;min-height:0;overflow-y:auto')}">`
    + head
    + (rows.length ? rows.map((c, i) => ctxRow(c, i, rows.length)).join('')
                   : emptyState())
    + `</div></div></div>`;
}


/* ═══ Whitelist URLs ══════════════════════════════════════════════════════
   The second settings section, built on the same chassis as Context: the same
   column spec and computed gutters, the same row hover, the same drawer and the
   same destructive modal. Two things genuinely differ. Whitelist is org-only —
   there is no personal whitelist — so it carries no scope column and no scope
   filter. And its entries are deleted rather than archived, which is why the
   row menu ends in a destructive action where Context's ends in Archive.
   ═════════════════════════════════════════════════════════════════════════ */

const WL_METHODS = ['GET', 'POST', 'PUT'];

let WSEQ = 0;
const wmk = o => Object.assign({
  id:'w' + (++WSEQ), paths:[], methods:[], expires:null,
  /* An expiry is a moment, not a day, so the date carries a time and a zone
     beside it. 23:59 is the default because an expiry means "good until the end
     of", and the org's own zone leads because that is what every other timestamp
     on these screens is read in. */
  expiryHM:'23:59', expiryTZ:'IST',
  remarks:'', active:true,
}, o);

const WL_SEED = [
  wmk({ domain:'https://api.loyalty.trendly.com',
        paths:['/v2/members/*', '/v2/points/issue'], methods:['GET','POST'],
        expires:'Mar 31, 2027', remarks:'Member lookup and points issue for the copilot.',
        by:'rahul.kamath', date:'Sep 12, 2026', time:'10:22 AM IST' }),
  wmk({ domain:'https://reports.trendly.com',
        paths:['/v1/exports/*'], methods:['GET'],
        expires:null, remarks:'Read-only export feed used by the weekly usage report.',
        by:'bhaskar.priyadarshi', date:'Sep 3, 2026', time:'4:40 PM IST' }),
  wmk({ domain:'https://tier-engine.trendly.com',
        paths:['/tiers/*', '/tiers/*/history'], methods:['GET','POST','PUT'],
        expires:'Jan 15, 2027', remarks:'',
        by:'harsh.devda', date:'Aug 22, 2026', time:'11:58 AM IST' }),
  wmk({ domain:'https://sandbox.trendly.com',
        paths:['/v1/*'], methods:['GET','POST'],
        expires:'Aug 31, 2026', remarks:'Sandbox trial for the tier migration work.',
        by:'ann.francis', date:'Jul 30, 2026', time:'2:05 PM IST' }),
  wmk({ domain:'https://legacy-crm.trendly.com',
        paths:['/crm/customer/*'], methods:['GET'], active:false,
        expires:null, remarks:'Turned off while the CRM migration runs.',
        by:'chinmay', date:'Jun 18, 2026', time:'9:12 AM IST' }),
];
let WL = clone(WL_SEED);
const WX = id => WL.find(w => w.id === id);

/* Expiry is a date in the org's timezone, so "expired" is derived from it rather
   than stored — a stored flag would be wrong the moment the date passed. */
const NOW_STAMP = Date.parse(NOW.date);
const wlState = w => !w.active ? 'inactive'
  : (w.expires && Date.parse(w.expires) < NOW_STAMP) ? 'expired' : 'active';
const WL_STATE = {
  active:   { label:'Active',   dot:'var(--aira-text-success)' },
  inactive: { label:'Inactive', dot:'var(--aira-text-tertiary)' },
  expired:  { label:'Expired',  dot:'var(--aira-text-warning)' },
};
/* AiraChip with a status dot. Not a Pill — Pill is reserved for the six approval
   lifecycle states, and these are not those. The dot carries the distinction
   alongside the word, so it survives grayscale. */
const wlChip = st => {
  const t = WL_STATE[st];
  /* inline-flex, not flex: as the only child of a block cell a flex span
     stretches to the cell's width, which is what turned these into wide pills
     with their label stranded at the left end. */
  return `<span style="${row(6,`${F.lblSm};color:var(--aira-text-secondary);`
      + 'background:var(--aira-bg-default);border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-pill);height:20px;padding:0 10px;'
      + 'display:inline-flex;width:fit-content')}">`
    + `<span aria-hidden="true" style="width:6px;height:6px;flex:none;`
    + `border-radius:var(--aira-radius-pill);background:${t.dot}"></span>${t.label}</span>`;
};

const WCOLS = {
  domain: { cell:'flex:1 1 0;min-width:200px' },
  /* Measured, not guessed: the widest chip is 80px and the widest date 82px, so
     a 104px status column and a 140px expiry column were each carrying 25-58px
     of dead space that read as a wider gap than the gutter beside it. */
  state:  { cell:'width:84px;flex:none' },
  expiry: { cell:'width:88px;flex:none' },
  by:     { cell:'flex:0 1 288px;min-width:180px' },
  act:    { cell:'width:56px;flex:none' },
};
/* Domains are a narrow, predictable shape — the six seeded ones measure 165 to
   193px — so unlike a free-text context name this column can be sized almost
   exactly to its content and leave barely any rag. */
const WL_FIXED = 84 + 88 + 288 + 56, WL_TARGET = 196;

const WL_STATUSES = [['all','All'], ['active','Active'],
                     ['inactive','Inactive'], ['expired','Expired']];

const wlMatches = w => {
  const q = S.wlQuery.trim().toLowerCase();
  return !q || w.domain.toLowerCase().indexOf(q) >= 0
            || email(w.by).toLowerCase().indexOf(q) >= 0
            || w.paths.some(x => x.toLowerCase().indexOf(q) >= 0);
};
const wlRows = () => WL
  .filter(w => (S.wlStatus === 'all' || wlState(w) === S.wlStatus) && wlMatches(w))
  .sort((a, b) => Date.parse(b.date) - Date.parse(a.date));

function whitelistListing() {
  const rows = wlRows();

  const wlMenu = (w, i, total) => {
    if (S.menu !== w.id) return '';
    const items = [['View URL', I.eye, 'view']];
    if (wlCanEdit()) {
      items.push(['Edit URL', I.squarePen, 'edit']);
      items.push(['Delete URL', I.trash, 'delete']);
    }
    const up = total > 4 && i >= total - 3;
    return `<div class="menu" role="menu" style="${col(0,'position:absolute;right:0;'
        + (up ? 'bottom:calc(100% + 4px);' : 'top:calc(100% + 4px);')
        + 'width:216px;background:var(--aira-bg-elevated);'
        + 'border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);box-shadow:var(--aira-shadow-lg);'
        + 'padding:8px;z-index:4')}">`
      + items.map(([t, g, a]) => `<button class="reset mitem" role="menuitem" `
          + `style="${row(12,'padding:8px 12px;border-radius:var(--aira-radius-xs);'
          + F.body + ';color:var(--aira-text-'
          + (a === 'delete' ? 'danger' : 'secondary') + ')')}"`
        + live('wlmi:' + a + ':' + w.id) + `>${g(ICON_WITH_LABEL)}${esc(t)}</button>`).join('')
      + `</div>`;
  };

  const wlRow = (w, i, total) => {
    const on = S.drawer && S.drawer.kind === 'wl' && S.drawer.id === w.id;
    return `<div class="hov"` + live('wlopen:' + w.id)
      + ` style="${row(0,`padding:12px ${CELL}px;cursor:pointer;`
        + 'border-bottom:1px solid var(--aira-border-subtle);'
        + (on ? 'background:var(--aira-bg-selected);' : ''))}">`
      + `<div style="${row(8,WCOLS.domain.cell)}">`
      + `<button class="reset namebtn" data-tip="${esc(w.domain)}" style="${F.lblMd};`
      + `color:var(--aira-text-primary);${ellip};text-align:left;flex:0 1 auto;`
      + `min-width:0;padding:8px 0;margin:-8px 0;position:relative"`
      + live('wlopen:' + w.id) + `>${esc(w.domain)}</button></div>`
      + gutter
      + `<div style="${WCOLS.state.cell}">${wlChip(wlState(w))}</div>`
      + gutter
      + `<div style="${WCOLS.expiry.cell}"><span class="quiet" style="${F.body};`
      + `color:var(--aira-text-${w.expires ? 'primary' : 'tertiary'});${tab}">`
      + `${esc(w.expires || 'No expiry')}</span></div>`
      + gutter
      + `<div style="${WCOLS.by.cell}"><span title="${esc(email(w.by))}" style="${F.body};`
      + `color:var(--aira-text-primary);display:block;${ellip}">`
      + `${esc(email(w.by))}</span></div>`
      + gutter
      + `<div style="${row(0,WCOLS.act.cell)}">`

      + 'border-bottom:1px solid var(--aira-border-default)')}">`

    + hCell('Expiry', 'expiry') + gutter
    + hCell('Added by', 'by') + gutter
    + hCell('Actions', 'act') + `</div>`;

  const empty = () => {
    const q = S.wlQuery.trim();
    let title, body, cta = null;
    if (q) {
      title = 'No URLs match your search';
      body  = 'No domain, path or author contains “' + q + '”. '

    } else if (S.wlStatus !== 'all') {
      title = 'No ' + labelOf(WL_STATUSES, S.wlStatus).toLowerCase() + ' URLs';
      body  = 'Nothing matches this filter. Try All.';
    } else {
      title = 'No whitelisted URLs yet';
      body  = 'aiRA can only call an external service once its domain is on this '
            + 'list, so add the ones your agents need to reach.';
      cta   = wlCanCreate() ? 'Add URL' : null;
    }
    return `<div style="${col(8,'flex-grow:1;align-items:center;justify-content:center;'
        + 'padding:64px 24px;text-align:center')}">`
      + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(20)}</span>`
      + `<span style="${F.h4};color:var(--aira-text-primary)">${esc(title)}</span>`
      + `<span style="${F.bodySm};color:var(--aira-text-secondary);max-width:460px">`
      + `${esc(body)}</span>`
      + (cta ? `<span style="margin-top:8px">` + primaryBtn(cta, 'wladd', I.plus) + `</span>` : '')
      + `</div>`;
  };

  return `<div style="${col(0,`flex-grow:1;min-height:0;padding:24px ${INSET}px 32px`)}">`
    + `<div style="${row(0,'padding:0 0 20px')}">`
    + `<h1 style="${F.h2};color:var(--aira-text-primary);margin:0">Whitelist URLs</h1>`
    + `<span style="flex-grow:1"></span>`
    + iconBtn('Close settings', 'closesettings', I.x, 'var(--aira-text-tertiary)')
    + `</div>`

    + `<div style="${row(12,'padding:0 0 16px')}">`
    + dropdown(WL_STATUSES, 'wlstatus', S.wlStatus)
    + `<label class="qwrap" style="${row(8,'flex:1;max-width:360px;height:36px;'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
      + 'padding:0 12px;background:var(--aira-bg-elevated)')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(16)}</span>`
    + `<input class="qbox" id="wlqbox" type="text" value="${esc(S.wlQuery)}" `
    + `placeholder="Search URLs" aria-label="Search whitelisted URLs" `
    + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;`
    + `padding:0;flex:1;min-width:0"` + live('wlq') + `></label>`
    + `<span style="flex-grow:1"></span>`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary);${tab}">`
    + `${esc(plural(rows.length, 'URL'))}</span>`
    + `<span style="width:8px"></span>`
    + (rows.length && wlCanCreate() ? primaryBtn('Add URL', 'wladd', I.plus) : '')
    + `</div>`

    + `<div style="${col(0,'flex-grow:1;min-height:0;'
      + 'border-top:1px solid var(--aira-border-default)')}">`
    + `<div class="scroller" id="wltable" `
    + `style="${col(0,'flex-grow:1;min-height:0;overflow-y:auto')}">`
    + head
    + (rows.length ? rows.map((w, i) => wlRow(w, i, rows.length)).join('') : empty())
    + `</div></div></div>`;
}

/* AiraCheckbox. Custom-rendered rather than native so it carries the system's
   own box, tick and focus ring — and so a disabled read-only view can render the
   same control without a browser's default grey. */
function checkbox(label, key, on, disabled) {
  return `<button class="reset${disabled ? '' : ' hov'}" role="checkbox" `
    + `aria-checked="${!!on}"${disabled ? ' disabled aria-disabled="true"' : ''} `
    + `style="${row(8,'padding:6px 8px;margin:-6px -8px;'
      + 'border-radius:var(--aira-radius-md);' + F.body
      + ';color:var(--aira-text-primary)')}"`
    + (disabled ? '' : live(key)) + `>`
    + `<span aria-hidden="true" style="${row(0,'justify-content:center')}width:16px;`
    + `height:16px;flex:none;border-radius:var(--aira-radius-xs);`
    + (on ? 'background:var(--aira-bg-brand);color:var(--aira-text-inverse);'
          + 'border:1px solid var(--aira-bg-brand)'
          : 'border:1px solid var(--aira-border-strong)') + `">`
    + (on ? I.check(14) : '') + `</span>${esc(label)}</button>`;
}


/* ── AiraDatePicker ──────────────────────────────────────────────────────
   Ported from the reskin's own .aira-datepicker rather than invented: a 280px
   popover under the trigger, a 26px nav pair, a 7-column grid of square days,
   and a Clear / Today footer above a rule. v1.1 has no date picker of its own —
   new-components.md still lists one as unbuilt — so the reskin is the closest
   thing to a spec, and the browser's native control is the thing it replaces.
   ──────────────────────────────────────────────────────────────────────── */

const DP_MONTHS = ['January','February','March','April','May','June','July',
                   'August','September','October','November','December'];
const DP_SHORT  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DP_DOW    = ['S','M','T','W','T','F','S'];
const dpToday   = new Date(NOW.date);
const dpFmt     = (y, m, d) => DP_SHORT[m] + ' ' + d + ', ' + y;

function datePicker(value, keyBase) {
  const open = S.dpOpen;
  const sel  = value ? new Date(value) : null;
  const view = S.dpView
    || (sel ? { y:sel.getFullYear(), m:sel.getMonth() }
            : { y:dpToday.getFullYear(), m:dpToday.getMonth() });

  const first = new Date(view.y, view.m, 1).getDay();
  const days  = new Date(view.y, view.m + 1, 0).getDate();
  const prevDays = new Date(view.y, view.m, 0).getDate();

  const cells = [];
  for (let i = 0; i < first; i++)
    cells.push({ d: prevDays - first + 1 + i, out:true });
  for (let d = 1; d <= days; d++) cells.push({ d, out:false });
  while (cells.length % 7) cells.push({ d: cells.length - first - days + 1, out:true });

  const dayBtn = c => {
    const isSel = !sel || c.out ? false
      : (sel.getFullYear() === view.y && sel.getMonth() === view.m && sel.getDate() === c.d);
    const isToday = !c.out && dpToday.getFullYear() === view.y
      && dpToday.getMonth() === view.m && dpToday.getDate() === c.d;
    const ink = isSel ? 'var(--aira-text-inverse)'
              : c.out ? 'var(--aira-text-disabled)'
              : isToday ? 'var(--aira-text-link)' : 'var(--aira-text-primary)';
    return `<button class="reset${c.out ? '' : ' hov'}" role="gridcell"`
      + (isSel ? ' aria-selected="true"' : '')
      + ` style="${row(0,'justify-content:center')}aspect-ratio:1;`
      + `font:${isSel || isToday ? 600 : 400} 13px/20px Roboto,system-ui,sans-serif;`
      + `border-radius:var(--aira-radius-sm);color:${ink};${tab};`
      + (isSel ? 'background:var(--aira-bg-brand);' : '') + `"`
      + (c.out ? '' : live('dpday:' + view.y + '-' + view.m + '-' + c.d))
      + `>${c.d}</button>`;
  };

  const navBtn = (label, key, glyph) =>
    `<button class="reset hov" style="${row(0,'justify-content:center')}width:26px;`
    + `height:26px;border-radius:var(--aira-radius-sm);`
    + `color:var(--aira-text-secondary)"` + named(label, key) + `>${glyph(16)}</button>`;

  const linkBtn = (label, key) =>
    `<button class="reset dplink" style="${F.bodySm};font-weight:500;`
    + `color:var(--aira-text-link)"` + live(key) + `>${esc(label)}</button>`;

  const popover = !open ? '' :
    `<div id="dppop" onclick="event.stopPropagation()" style="${col(0,'position:absolute;'
      + 'top:calc(100% + 4px);left:0;z-index:45;width:280px;padding:16px;'
      + 'background:var(--aira-bg-elevated);border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-lg);box-shadow:var(--aira-shadow-md)')}">`
    + `<div style="${row(0,'justify-content:space-between;margin-bottom:12px')}">`
    + `<span style="${F.lblMd};font-weight:600;color:var(--aira-text-primary)">`
    + `${DP_MONTHS[view.m]} ${view.y}</span>`
    + `<span style="${row(2)}">`
    + navBtn('Previous month', 'dpprev', I.chevronLeft)
    + navBtn('Next month', 'dpnext', I.chevronRight) + `</span></div>`
    + `<div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;`
    + `margin-bottom:4px">`
    + DP_DOW.map(d => `<span style="${F.over};color:var(--aira-text-tertiary)">${d}</span>`).join('')
    + `</div>`
    + `<div role="grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`
    + cells.map(dayBtn).join('') + `</div>`
    /* An expiry is a moment, so the calendar carries the time beside it rather
       than leaving it at an assumed midnight. One field and one pair of radios
       — the system has no time picker, and three stacked dropdowns in a 280px
       popover would be a component invented to avoid a text box. */
    + `<div style="${row(8,'margin-top:12px;padding-top:12px;'
      + 'border-top:1px solid var(--aira-border-default)')}">`
    + `<span style="${F.lblSm};color:var(--aira-text-secondary);flex:none">Time</span>`
    + `<label class="qwrap" style="${row(0,'width:64px;height:28px;flex:none;'
      + 'border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-md);padding:0 8px;'
      + 'background:var(--aira-bg-elevated)')}">`
    + `<input class="qbox" id="dphm" type="text" value="${esc(S.form.expiryHM)}" `
    + `inputmode="numeric" aria-label="Expiry time, 24-hour" `
    + `style="${F.bodySm};color:var(--aira-text-primary);border:0;background:none;`
    + `padding:0;width:100%;${tab}"` + live('dphm') + `></label>`
    + tzPicker() + `</div>`
    + `<div style="${row(0,'justify-content:space-between;margin-top:12px;padding-top:12px;'
      + 'border-top:1px solid var(--aira-border-default)')}">`
    + linkBtn('Clear', 'dpclear') + linkBtn('Today', 'dptoday') + `</div></div>`;

  return `<div style="position:relative;width:fit-content">`
    + `<button class="reset" aria-haspopup="dialog" aria-expanded="${open}" `
    + `style="${row(8,'height:36px;min-width:220px;padding:0 12px;'
      + 'justify-content:space-between;'
      + `border:1px solid var(--aira-border-${open ? 'focus' : 'default'});`
      + 'border-radius:var(--aira-radius-md);background:var(--aira-bg-elevated);'
      + F.body + ';color:var(--aira-text-'
      + (value ? 'primary' : 'placeholder') + ')')}"`
    + named('Expiry date', 'dptoggle') + `>`
    + `<span style="${tab}">${esc(value
        ? value + ', ' + S.form.expiryHM + ' ' + S.form.expiryTZ
        : 'Select a date')}</span>`
    + `<span style="color:var(--aira-text-tertiary);display:flex">`
    + I.calendar(16) + `</span></button>`
    + popover + `</div>`;
}

/* AiraDropdown, sized for the picker rather than the filter bar. Nine zones is
   past the five at which options stop being worth showing all at once, so this
   is a dropdown and not a radio group. It opens upward: the time row is the
   bottom of the calendar, and a list dropping below it would fall out of the
   popover. */
function tzPicker() {
  const open = S.menu === '__dptz';
  const sel = S.form.expiryTZ;
  return `<span style="position:relative;display:inline-flex;flex:none">`
    + `<button class="reset hov" aria-haspopup="listbox" aria-expanded="${open}" `
    + `style="${row(4,'height:28px;padding:0 6px 0 10px;'
      + 'border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-md);' + F.bodySm
      + ';color:var(--aira-text-primary);white-space:nowrap')}"`
    + named('Expiry time zone', 'dptz') + `>${esc(sel)}`
    + `<span style="color:var(--aira-text-tertiary);display:flex">`
    + I.chevronDown(14) + `</span></button>`
    + (open
      ? `<div class="menu" role="listbox" style="${col(0,'position:absolute;right:0;'
          + 'bottom:calc(100% + 4px);width:200px;max-height:220px;overflow-y:auto;'
          + 'background:var(--aira-bg-elevated);'
          + 'border:1px solid var(--aira-border-default);'
          + 'border-radius:var(--aira-radius-md);box-shadow:var(--aira-shadow-lg);'
          + 'padding:8px;z-index:6')}">`
        + TZONES.map(([k, t]) => `<button class="reset mitem${k === sel ? ' sel' : ''}" `
          + `role="option" aria-selected="${k === sel}" style="${row(8,'padding:8px 12px;'
            + 'border-radius:var(--aira-radius-xs);' + F.bodySm
            + ';color:var(--aira-text-secondary);white-space:nowrap')}"`
          + live('dptz:' + k) + `>`
          + `<span style="flex:1;min-width:0;text-align:left">${esc(t)}</span>`
          + (k === sel ? `<span style="flex:none;display:flex;color:var(--aira-text-link)">`
              + I.check(14) + `</span>` : '') + `</button>`).join('')
        + `</div>`
      : '')
    + `</span>`;
}

function wlDrawer() {

  const mode = S.drawer.mode, readOnly = mode === 'view';
  const w = S.form;
  const title = mode === 'add' ? 'Add whitelist URL'
              : mode === 'edit' ? 'Edit whitelist URL' : w.domain;

  const header = `<div style="${col(4,'padding:20px 24px 16px;flex:none;'
      + 'border-bottom:1px solid var(--aira-border-default)')}">`

    + `<span style="${col(4,'flex:1;min-width:0')}">`
    + `<h2 id="drawertitle" style="${F.h3};color:var(--aira-text-primary);margin:0;${ellip}" `
    + `title="${esc(title)}">${esc(title)}</h2></span>`

  const readList = items => `<div style="${col(8)}">` + items.map(t =>
      `<div style="${row(8,'height:36px;padding:0 12px;'
        + 'border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);' + F.mono
        + ';color:var(--aira-text-primary);' + ellip)}">${esc(t)}</div>`).join('') + `</div>`;

  let body;
  if (readOnly) {
    body = `<div style="${col(32,'padding:24px')}">`

      + `background:var(--aira-border-subtle)"></div>`
      + block('Domain URL', `<div style="${F.body};color:var(--aira-text-secondary);`
          + `word-break:break-all">${esc(w.domain)}</div>`)
      + block('Path patterns', readList(w.paths.filter(x => x.trim())))
      + block('HTTP methods', `<div style="${row(8,'flex-wrap:wrap')}">`
          + w.methods.map(m => `<span style="${F.lblSm};`
              + `color:var(--aira-text-secondary);background:var(--aira-bg-muted);`
              + `border-radius:var(--aira-radius-pill);height:20px;padding:0 ${TAG_PAD}px;`
              + `display:inline-flex;align-items:center">${m}</span>`).join('')
          + `</div>`)
      + block('Expiry', `<div style="${F.body};color:var(--aira-text-secondary);${tab}">`
          + `${esc(w.expires ? w.expires + ', ' + w.expiryHM + ' ' + w.expiryTZ
                             : 'No expiry')}</div>`)
      + (w.remarks.trim()
          ? block('Remarks', `<div style="${F.body};color:var(--aira-text-secondary);`
              + `white-space:pre-wrap">${esc(w.remarks)}</div>`)
          : '')
      + `</div>`;
  } else {
    const err = S.submitted ? wlErrors() : {};
    body = `<div style="${col(20,'padding:24px')}">`

          textInput('wdomain', w.domain, 'https://example.com', 'wldomain',
                    { required:true, invalid:!!err.domain, describedBy:'wdomain-msg' }),
          null, err.domain)
      /* Several paths per domain, each its own row, because a single field

      + `<span style="color:var(--aira-text-danger)"> *</span></label>`

          return `<div class="qwrap" style="${row(4,'height:36px;'

            + 'background:var(--aira-bg-elevated)')}">`
          + `<input class="qbox" id="wpath${i}" type="text" value="${esc(pth)}" `
          + `placeholder="/v1/api/*" aria-label="Path pattern ${i + 1}" `
          + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;`

        }).join('')
      + ghostBtn('Add path pattern', 'wlpathadd', I.plus)

      + `<div style="${col(8)}">`
