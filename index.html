      + `<div style="${row(20,'flex-wrap:wrap')}">`
      + WL_METHODS.map(m => checkbox(m, 'wlmethod:' + m,
          w.methods.indexOf(m) >= 0, false)).join('')
      + `</div>`
      + (err.methods ? `<span role="alert" style="${row(8,F.bodySm
            + ';color:var(--aira-text-danger)')}">${I.circleAlert(16)}${esc(err.methods)}</span>`
          : '')
      + `</div>`
      /* A native date control on purpose: v1.1 has no date picker — the
         watchlist in new-components.md still lists one as unbuilt — and the live
         product uses the browser's. Inventing one here would put a component on
         screen that nobody can ship. */
      + `<div style="${col(8)}">`
      + `<span style="${F.lblMd};color:var(--aira-text-primary)">Expiry date</span>`
      + datePicker(w.expires, 'wlexpires') + `</div>`
      + `<div style="${col(8)}">`
      + `<label for="wrem" style="${F.lblMd};color:var(--aira-text-primary)">Remarks</label>`
      + `<div class="qwrap" style="${col(0,'border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);overflow:hidden')}">`
      + `<textarea class="tbox" id="wrem" rows="3" `
      + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;`
      + `padding:12px;min-height:76px;width:100%"` + live('wlremarks')
      + `>${esc(w.remarks)}</textarea></div></div>`
      + checkbox('Active', 'wlactive', w.active, false)
      + `</div>`;
  }

  const canSave = !readOnly && (mode === 'add' || wlDirty());
  const footer = `<div style="${row(8,'padding:16px 24px;flex:none;justify-content:flex-end;'
      + 'border-top:1px solid var(--aira-border-default)')}">`
    + (readOnly
        ? (wlCanEdit()
            ? ghostBtn('Close', 'wlclose') + primaryBtn('Edit URL', 'wledit', I.squarePen)
            : ghostBtn('Close', 'wlclose'))
        : ghostBtn('Cancel', 'wlclose')
          + primaryBtn(mode === 'add' ? 'Create URL' : 'Save changes', 'wlsave', null,
                       { disabled: !canSave }))
    + `</div>`;

  return `<div style="${row(0,'position:absolute;inset:0;justify-content:flex-end;'
      + 'background:var(--aira-bg-scrim);z-index:6')}"` + live('wlclose') + `>`
    + `<div id="ctxdrawer" role="dialog" aria-modal="true" aria-labelledby="drawertitle" `
    + `style="${col(0,`width:${DRAWER_W}px;max-width:100%;height:100%;`
      + 'background:var(--aira-bg-elevated);box-shadow:var(--aira-shadow-lg)')}" `
    + `onclick="event.stopPropagation()">`
    + header
    + `<div class="scroller" id="dscroll" style="${col(0,'flex:1;min-height:0;'
      + 'overflow-y:auto')}"` + live('dpclose') + `>` + body + `</div>`
    + footer + `</div></div>`;
}

const wlDirty = () => !!S.form && !!S.pristine
  && JSON.stringify(S.form) !== JSON.stringify(S.pristine);

function wlErrors() {
  const w = S.form, e = {};
  const d = w.domain.trim();
  if (!d) e.domain = 'Give the domain before saving';
  else if (!/^https?:\/\/[^\s/]+\.[^\s/]+/.test(d))
    e.domain = 'Start with http:// or https:// and a full domain';
  if (!w.paths.some(x => x.trim())) e.paths = 'Add at least one path pattern';
  if (!w.methods.length) e.methods = 'Choose at least one method';
  return e;
}

function wlOpen(mode, id) {
  const src = id ? WX(id) : null;
  S.drawer = { kind:'wl', mode, id: id || null };
  S.form = src ? clone(src) : wlBlank();
  S.pristine = clone(S.form);
  S.submitted = false; S.menu = null; S.dpOpen = false; S.dpView = null;
}

/* ═══ the drawer ═════════════════════════════════════════════════════════
   Add, edit and view are one surface in three modes. A drawer rather than a
   centred modal: it is the pattern almost every other secondary aiRA surface
   already uses, and it leaves the list it came from visible behind it. ──── */

const DRAWER_W = 760;

/* AiraField — label, control, helper and error composed, with the parts wired
   together: label/for to the control's id, the message linked by
   aria-describedby, and the required state carried by aria-required rather than
   by a decorative asterisk the screen reader never reaches. */
function field(id, label, req, controlHtml, hint, error) {
  const msg = error || hint;
  return `<div style="${col(8)}">`
    + `<label for="${id}" style="${F.lblMd};color:var(--aira-text-primary)">${esc(label)}`
    + (req ? `<span style="color:var(--aira-text-danger)"> *</span>` : '') + `</label>`
    + controlHtml
    + (msg
       ? `<span id="${id}-msg"${error ? ' role="alert"' : ''} style="${
           error ? row(8, F.bodySm + ';color:var(--aira-text-danger)')
                 : F.bodySm + ';color:var(--aira-text-tertiary)'}">`
         + (error ? I.circleAlert(16) : '') + esc(msg) + `</span>`
       : '')
    + `</div>`;
}

function textInput(id, value, ph, key, opts={}) {
  const inv = !!opts.invalid;
  return `<label class="qwrap" style="${row(8,'height:36px;'
    + `border:1px solid ${inv ? 'var(--aira-text-danger)' : 'var(--aira-border-default)'};`
    + 'border-radius:var(--aira-radius-md);padding:0 12px;background:var(--aira-bg-elevated)')}">`
    + `<input class="qbox" id="${id}" type="text" value="${esc(value)}" placeholder="${esc(ph)}"`
    + (opts.label ? ` aria-label="${esc(opts.label)}"` : '')
    + (opts.required ? ' aria-required="true"' : '')
    + (inv ? ' aria-invalid="true"' : '')
    + (opts.describedBy ? ` aria-describedby="${opts.describedBy}"` : '')
    + ` style="${F.body};color:var(--aira-text-primary);border:0;background:none;padding:0;`
    + `flex:1;min-width:0"` + live(key) + `></label>`;
}

/* Never a native select. For a member the Org option stays visible and disabled
   with the reason attached — removing it would leave them wondering whether org
   context exists at all. */
function scopeDropdown() {
  const open = S.menu === '__fscope';
  const val = S.form.scope;
  const opts = [['org','Org'], ['user','User']];
  const locked = k => k === 'org' && !canEditOrg();
  return `<span style="position:relative;display:block">`
    + `<button class="reset hov" id="fscope" aria-haspopup="listbox" aria-expanded="${open}" `
    + `style="${row(8,'width:100%;height:36px;border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-md);padding:0 12px 0 16px;' + F.body
      + ';color:var(--aira-text-primary)')}"` + live('fscope') + `>`
    + `<span style="flex:1;min-width:0;text-align:left">${esc(labelOf(opts, val))}</span>`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.chevronDown(14)}</span></button>`
    + (open
      ? `<div class="menu" role="listbox" style="${col(0,'position:absolute;left:0;right:0;'
          + 'top:calc(100% + 4px);background:var(--aira-bg-elevated);'
          + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
          + 'box-shadow:var(--aira-shadow-lg);padding:8px;z-index:5')}">`
        + opts.map(([k, t]) => {
            const off = locked(k);
            return `<button class="reset mitem${k === val ? ' sel' : ''}" role="option" `
              + `aria-selected="${k === val}"${off ? ' disabled aria-disabled="true"' : ''} `
              + `style="${rowTop(8,'padding:8px 12px;border-radius:var(--aira-radius-xs);'
                + F.body + ';color:var(--aira-text-secondary)')}"`
              + (off ? '' : live('fscope:' + k)) + `>`
              + `<span style="${col(4,'flex:1;min-width:0;text-align:left')}">`
              + `<span>${esc(t)}</span>`
              + (off ? `<span style="${F.bodySm};color:var(--aira-text-tertiary)">`
                       + `Only a super admin can add an org context</span>` : '')
              + `</span>`
              + (off ? `<span style="flex:none;display:flex;color:var(--aira-text-tertiary)">`
                       + I.lock(16) + `</span>` : '')
              + (k === val ? `<span style="flex:none;display:flex;color:var(--aira-text-link)">`
                       + I.check(16) + `</span>` : '') + `</button>`;
          }).join('')
        + `</div>`
      : '')
    + `</span>`;
}

/* The formatting strip is inert — v1.1 has no rich-text editor, so this is a
   composition standing in for one. It is grouped the way the work is grouped:
   weight, then block structure, then what you insert, then alignment, then the
   two history controls, then clear. Dividers carry the grouping so the reader
   does not have to infer it from spacing, and the whole strip is aria-hidden
   with no tab stop because none of it does anything yet. */
const RTE_GROUPS = [
  [['Bold', I.bold], ['Italic', I.italic], ['Underline', I.underline],
   ['Strikethrough', I.strikethrough]],
  [['Heading 1', I.heading1], ['Heading 2', I.heading2], ['Heading 3', I.heading3],
   ['Bulleted list', I.list], ['Numbered list', I.listOrdered], ['Quote', I.quote]],
  [['Insert link', I.link], ['Remove link', I.unlink], ['Code', I.code],
   ['Insert table', I.table]],
  [['Align left', I.alignLeft], ['Align centre', I.alignCenter],
   ['Align right', I.alignRight]],
  [['Undo', I.undo], ['Redo', I.redo]],
  [['Clear formatting', I.removeFormatting]],
];
const rteToolbar = () =>
  `<div aria-hidden="true" style="${row(4,'padding:8px;background:var(--aira-bg-subtle);'
    + 'border-bottom:1px solid var(--aira-border-default);flex-wrap:wrap')}">`
  + RTE_GROUPS.map((group, gi) =>
      /* The strip's own 4px gap already sits on both sides of a divider, so a
         margin on top of it is what pushed the last control onto a second row. */
      (gi ? `<span style="width:1px;height:20px;flex:none;`
            + `background:var(--aira-border-default)"></span>` : '')
      + group.map(([label, glyph]) =>
          `<span title="${esc(label)}" style="${row(0,'justify-content:center')}width:28px;`
          + `height:28px;flex:none;border-radius:var(--aira-radius-sm);`
          + `color:var(--aira-text-secondary)">${glyph(16)}</span>`).join('')).join('')
  + `</div>`;

function attachmentBlock(readOnly) {
  const list = S.form.attachments;
  if (readOnly && !list.length) return '';
  const fileRow = (a, i) =>
    `<div style="${row(12,'height:44px;padding:0 8px 0 12px;'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md)')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.paperclip(16)}</span>`
    + `<span style="${F.body};color:var(--aira-text-primary);flex:1;min-width:0;${ellip}">`
    + `${esc(a.name)}</span>`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary);flex:none;${tab}">`
    + `${esc(a.size)}</span>`
    + `<span style="${row(4,'flex:none')}">`
    + iconBtn('Download ' + a.name, 'attget:' + i, I.download)
    + (readOnly ? '' : iconBtn('Remove ' + a.name, 'attdel:' + i, I.trash))
    + `</span></div>`;
  return `<div style="${col(8)}">`
    + `<span style="${F.lblMd};color:var(--aira-text-primary)">Attachments</span>`
    + (list.length
        ? `<div style="${col(8)}">` + list.map(fileRow).join('') + `</div>`
        : (readOnly
            ? `<span style="${F.bodySm};color:var(--aira-text-tertiary)">`
              + `No files attached</span>`
            : ''))
    + (readOnly ? '' : ghostBtn('Attach file', 'attadd', I.paperclip))
    + `</div>`;
}

/* Two key types, and the row says which — the type decides what the value even
   is, and a single-line field cannot hold an OAuth block. A value is write-only:
   it is never rendered back, here or anywhere else. */
function keysBlock(readOnly) {
  const keys = S.form.keys;
  if (readOnly && !keys.length) return '';
  const head = `<button class="reset" aria-expanded="${S.keysOpen}" `
    + `style="${row(8,'padding:8px 0')}"` + live('keys') + `>`
    + `<span aria-hidden="true" style="color:var(--aira-text-tertiary);display:flex;`
    + `transform:rotate(${S.keysOpen?90:0}deg);`
    + `transition:transform var(--aira-motion-fast) ease-out">${I.chevronRight(16)}</span>`
    + `<span style="${F.lblMd};color:var(--aira-text-primary)">`
    + `${readOnly ? 'Context keys' : 'Manage context keys'}</span>`
    + `<span style="${F.lblSm};color:var(--aira-text-secondary);background:var(--aira-bg-muted);`
    + `border-radius:var(--aira-radius-pill);padding:4px 8px;${tab}">${keys.length}</span>`
    + `</button>`;

  if (!S.keysOpen) {
    return `<div style="${col(8,'padding-top:8px;'
      + 'border-top:1px solid var(--aira-border-subtle)')}">` + head
      + `</div>`;
  }

  const keyRow = (k, i) => {
    if (S.keyEdit === i) {
      return `<div style="${col(8,'padding:12px;'
        + 'border:1px solid var(--aira-border-focus);border-radius:var(--aira-radius-md);'
        + 'background:var(--aira-bg-elevated)')}">`
        + `<div style="${rowTop(8)}">`
        + `<span style="flex:1;min-width:0">`
        + field('kname', 'Key name', true, textInput('kname', k.name, '', 'kname'))
        + `</span>`
        + `<span style="${row(4,'padding-top:24px')}">`
        + iconBtn('Save key', 'ksave', I.check, 'var(--aira-text-link)')
        + iconBtn('Cancel key edit', 'kcancel', I.x, 'var(--aira-text-tertiary)')
        + `</span>`
        + `</div>`
        + (k.type === 'oauth'
          ? `<span style="${row(8,F.bodySm + ';color:var(--aira-text-secondary)')}">`
            + I.braces(16) + `An OAuth key is edited as JSON. Use Bulk edit.</span>`
          : field('kval', 'New value', false, textInput('kval', '', '', 'kval')))
        + `</div>`;
    }
    return `<div style="${row(12,'height:44px;padding:0 8px 0 12px;'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md)')}">`
      + `<span style="color:var(--aira-text-tertiary);display:flex">${I.keyRound(16)}</span>`
      + `<span style="${F.body};color:var(--aira-text-primary);flex:1;min-width:0;${ellip}">`
      + `${esc(k.name)}</span>`
      + keyTypeTag(k.type)
      + (readOnly ? ''
        : `<span style="${row(4,'flex:none')}">`
          + iconBtn('Edit ' + k.name, 'kedit:' + i, I.squarePen)
          + iconBtn('Delete ' + k.name, 'kdel:' + i, I.trash) + `</span>`)
      + `</div>`;
  };

  return `<div style="${col(12,'padding-top:8px;'
    + 'border-top:1px solid var(--aira-border-subtle)')}">`
    + `<div style="${row(0)}">${head}<span style="flex-grow:1"></span>`
    + (readOnly ? '' : ghostBtn('Bulk edit', 'bulk')) + `</div>`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary)">`
    + `aiRA sees the key name, never the value.</span>`
    + (keys.length
        ? `<div style="${col(8)}">` + keys.map(keyRow).join('') + `</div>`
        : `<div style="${col(4,'align-items:center;padding:20px;'
            + 'border:1px dashed var(--aira-border-strong);'
            + 'border-radius:var(--aira-radius-md)')}">`
          + `<span style="color:var(--aira-text-tertiary);display:flex">${I.lock(20)}</span>`
          + `<span style="${F.bodySm};color:var(--aira-text-secondary)">`
          + `No keys on this context</span></div>`)
    + (readOnly ? '' : ghostBtn('Add key', 'addkey'))
    + `</div>`;
}

function drawer() {
  if (!S.drawer) return '';
  const mode = S.drawer.mode, readOnly = mode === 'view';
  const c = S.form;
  const title = mode === 'add' ? 'Add context' : mode === 'edit' ? 'Edit context' : c.name;

  /* The header carries the context's name, so scrolling past the Name field
     never leaves the reader wondering which context they are in. */
  const header = `<div style="${col(4,'padding:20px 24px 16px;flex:none;'
      + 'border-bottom:1px solid var(--aira-border-default)')}">`
    + `<div style="${rowTop(12)}">`
    + `<span style="${col(4,'flex:1;min-width:0')}">`
    + `<h2 id="drawertitle" style="${F.h3};color:var(--aira-text-primary);margin:0;${ellip}" `
    + `title="${esc(title)}">${esc(title)}</h2>`
    /* The header is the title alone in every mode. Author and time used to run on
       after it as one long line — two unrelated facts competing for one row, read
       as a sentence rather than looked up. They are a labelled strip in the body
       now, the same one the view drawer uses. */
    + `</span>`
    + iconBtn('Close context drawer', 'dclose', I.x) + `</div></div>`;

  /* A label over its value, which is how three facts sit side by side without
     reading as a sentence. */
  const fact = (label, value) =>
    `<span style="${col(2,'min-width:0')}">`
    + `<span style="${F.lblSm};color:var(--aira-text-tertiary)">${esc(label)}</span>`
    + `<span style="${F.body};color:var(--aira-text-primary);${ellip}" `
    + `title="${esc(value)}">${esc(value)}</span></span>`;
  const factTag = (label, tagHtml) =>
    `<span style="${col(4,'min-width:0;align-items:flex-start')}">`
    + `<span style="${F.lblSm};color:var(--aira-text-tertiary)">${esc(label)}</span>`
    + tagHtml + `</span>`;

  let body;
  if (readOnly) {
    /* Read-only, so the three sections need to be told apart by their shape
       rather than by their controls: a metadata strip, then the context on its
       own surface, then the things attached to it. 32px between sections and
       8px inside one is what separates them. */
    body = `<div style="${col(32,'padding:24px')}">`
      + `<div style="${row(32,'flex-wrap:wrap')}">`
      + factTag('Scope', scopeTag(c.scope))
      + fact('Last changed by', email(c.by))
      + fact('Last changed on', c.date + ', ' + c.time)
      + `</div>`
      /* A rule between what the context IS and what it SAYS. The 32px gap alone
         reads as breathing room rather than as a boundary. */
      + `<div role="separator" style="height:1px;flex:none;`
      + `background:var(--aira-border-subtle)"></div>`
      + `<div style="${col(8)}">`
      + `<span style="${F.lblMd};color:var(--aira-text-primary)">Context</span>`
      /* The text sits on its own surface. Unboxed, it ran straight into the
         labels above and below it and the whole drawer read as one block. */
      + `<div style="${F.body};color:var(--aira-text-secondary);white-space:pre-wrap;`
      + `background:var(--aira-bg-subtle);border:1px solid var(--aira-border-subtle);`
      + `border-radius:var(--aira-radius-md);padding:16px">`
      + `${esc(c.body || 'This context has no written content.')}</div></div>`
      + attachmentBlock(true) + keysBlock(true) + `</div>`;
  } else {
    const nameErr = S.submitted && nameMissing();
    /* Edit opens with the same two facts, laid out the same way, so moving
       between View and Edit does not move the reader's eye. Add has no history
       to show, so it opens straight into the form. */
    const history = mode !== 'edit' ? '' :
      `<div style="${row(32,'flex-wrap:wrap')}">`
      + fact('Last changed by', email(c.by))
      + fact('Last changed on', c.date + ', ' + c.time)
      + `</div>`
      + `<div role="separator" style="height:1px;flex:none;`
      + `background:var(--aira-border-subtle)"></div>`;
    body = `<div style="${col(20,'padding:24px')}">`
      + history
      + (S.scanError
        ? `<div role="alert" style="${rowTop(12,'padding:12px 16px;'
            + 'background:var(--aira-status-danger-bg);'
            + 'border-radius:var(--aira-radius-md)')}">`
          + `<span style="color:var(--aira-text-danger);display:flex;flex:none">`
          + `${I.circleAlert(20)}</span>`
          + `<span style="${col(4,'flex:1;min-width:0')}">`
          + `<span style="${F.lblMd};color:var(--aira-text-primary)">${esc(S.scanError)}</span>`
          + `<span style="${F.bodySm};color:var(--aira-text-secondary)">`
          + `Nothing was saved. Try again, or contact support if it keeps failing.</span>`
          + `</span></div>`
        : '')
      + field('fname', 'Name', true,
          textInput('fname', c.name, '', 'fname',
                    { required:true, invalid:nameErr, describedBy:'fname-msg' }),
          null, nameErr ? 'Give the context a name before saving' : null)
      + field('fscope', 'Scope', false, scopeDropdown(),
          c.scope === 'org' ? 'Everyone in the org can read this context.'
                            : 'Only you can read this context.')
      + `<div style="${col(8)}">`
      + `<label for="fbody" style="${F.lblMd};color:var(--aira-text-primary)">Context</label>`
      + `<div class="qwrap" style="${col(0,'border:1px solid var(--aira-border-default);'
        + 'border-radius:var(--aira-radius-md);overflow:hidden')}">`
      + rteToolbar()
      + `<textarea class="tbox" id="fbody" rows="9" `
      + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;`
      + `padding:12px;min-height:180px;width:100%"` + live('fbody')
      + `>${esc(c.body)}</textarea></div></div>`
      + attachmentBlock(false) + keysBlock(false) + `</div>`;
  }

  const footer = readOnly
    ? `<div style="${row(8,'padding:16px 24px;flex:none;justify-content:flex-end;'
        + 'border-top:1px solid var(--aira-border-default)')}">`
      + ghostBtn('Close', 'dclose')
      + (canEdit(CX(S.drawer.id) || c) ? primaryBtn('Edit context', 'dedit', I.squarePen) : '')
      + `</div>`
    : `<div style="${row(8,'padding:16px 24px;flex:none;justify-content:flex-end;'
        + 'border-top:1px solid var(--aira-border-default)')}">`
      + ghostBtn('Cancel', 'dclose')
      + primaryBtn(S.scanning ? 'Scanning…' : 'Scan and save', 'save', null,
          { disabled: !canSave(), spin: S.scanning })
      + `</div>`;

  return `<div style="${row(0,'position:absolute;inset:0;justify-content:flex-end;'
      + 'background:var(--aira-bg-scrim);z-index:6')}"` + live('scrim') + `>`
    + `<div id="ctxdrawer" role="dialog" aria-modal="true" aria-labelledby="drawertitle" `
    + `style="${col(0,`width:${DRAWER_W}px;height:100%;background:var(--aira-bg-elevated);`
      + 'border-left:1px solid var(--aira-border-default);box-shadow:var(--aira-shadow-lg)')}">`
    + header
    + `<div class="scroller" id="dscroll" style="${col(0,'flex:1;min-height:0;overflow-y:auto')}">`
    + body + `</div>` + footer + `</div></div>`;
}

/* ═══ modals ═════════════════════════════════════════════════════════════
   One at a time and never over another. Every one is a short confirmation
   except Bulk edit, which is a single form. ─────────────────────────────── */

/* The title asks the question and the body confirms it in plain words, which is
   the shape the published modal examples use ("Go back a step?" / "Are you sure
   you want to go back a step? ..."). No object name in either: the modal opens
   from the row or the field you clicked, so naming it adds length without
   adding certainty — and a long file or context name breaks the heading.

   The body runs as one paragraph. Forcing a break between the two sentences
   cured the widow but left the second line barely a tenth of the measure, so
   the copy read as narrower than the modal it sits in. See the note on
   text-wrap where the body is rendered. */
const MODALS = {
  archive: {
    role:'alertdialog', danger:true, mark:true,
    title: () => 'Archive this context?',
    body: 'Are you sure you want to archive this context? aiRA stops using it '
        + 'right away, and you can restore it later.',
    confirm:'Archive',
  },
  restore: {
    role:'dialog', danger:false, mark:false,
    title: () => 'Restore this context?',
    body: 'Are you sure you want to restore this context? aiRA starts using it '
        + 'again as soon as you confirm.',
    confirm:'Restore',
  },
  attdel: {
    role:'alertdialog', danger:true, mark:true,
    title: () => 'Remove this file?',
    body: 'Are you sure you want to remove this file from the context? aiRA stops '
        + 'reading it when you save, and you can attach it again later.',
    confirm:'Remove',
  },
  wldel: {
    role:'alertdialog', danger:true, mark:true,
    title: () => 'Delete this URL?',
    body: 'Are you sure you want to delete this whitelist URL? aiRA can no longer '
        + 'call it, and you would have to add it again from scratch.',
    confirm:'Delete',
  },
  keydel: {
    role:'alertdialog', danger:true, mark:true,
    title: () => 'Delete this key?',
    body: 'Are you sure you want to delete this key from the context? '
        + 'Its stored value goes with it and cannot be recovered.',
    confirm:'Delete',
  },
};

function modalEl() {
  if (!S.modal) return '';
  if (S.modal.kind === 'bulk') return bulkModal();
  const m = MODALS[S.modal.kind];
  if (!m) return '';
  /* Cancel is a tertiary text button, not an outlined one: the spec allows a
     single primary per decision surface, and a bordered Cancel reads as a peer. */
  /* Buttons, head, body and foot below are the published Modal anatomy —
     head 16/20/0, body 12/20/16 in Body md secondary, foot 12/20/16 with an
     8px gap and a subtle top border, 36px buttons at 0 16px and radius md.
     Cancel is tertiary: no border, no fill. */
  const b = (label, primary, fk) =>
    `<button class="reset hov" style="${row(0,'justify-content:center')}height:36px;`
    + `padding:0 16px;border-radius:var(--aira-radius-md);${F.lblMd};`
    + (primary
        ? `color:var(--aira-text-inverse);background:var(--aira-bg-`
          + (m.danger ? 'danger' : 'brand') + `)`
        : 'color:var(--aira-text-secondary)') + `"`
    + live(fk) + `>${esc(label)}</button>`;
  /* The warning mark is a 36px disc on the warning surface with a 20px glyph at
     stroke-width 2 in the warning ink — heavier than the 1.5 the rest of the
     iconography uses, which is what the published modal specifies. */
  const mark = m.mark
    ? `<span aria-hidden="true" style="${row(0,'justify-content:center')}width:36px;`
      + `height:36px;flex:none;border-radius:var(--aira-radius-circle);`
      + `background:var(--aira-status-warning-bg)">`
      + `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" `
      + `stroke="var(--aira-status-warning-text)" stroke-width="2" `
      + `stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0`
      + `l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/>`
      + `<path d="M12 17h.01"/></svg></span>`
    : '';
  return `<div style="${row(0,'position:absolute;inset:0;justify-content:center;'
      + 'align-items:center;background:var(--aira-bg-scrim);z-index:8')}">`
    + `<div id="ctxmodal" role="${m.role}" aria-modal="true" aria-labelledby="mtitle" `
    + `style="${col(0,'width:100%;max-width:440px;background:var(--aira-bg-surface);'
      + 'border-radius:var(--aira-radius-lg);box-shadow:var(--aira-shadow-lg);'
      + 'overflow:hidden')}">`
    + `<div style="${row(12,`padding:${mark ? 20 : 16}px 20px 0`)}">${mark}`
    + `<h2 id="mtitle" style="${F.h3};color:var(--aira-text-primary);min-width:0;margin:0;`
    + `overflow-wrap:anywhere">${esc(m.title(S.modal))}</h2></div>`
    /* text-wrap:balance, not pretty. Both are supported, but pretty only starts
       working on longer blocks — on a two-line body it leaves the last word alone
       on a stub of a line. balance is the one meant for short blocks.

       Balance only works if there is enough copy to fill the lines it makes: it
       divides the text evenly, so 71 characters became two half-empty lines of
       about 210px in a 400px measure. Each body below is written long enough to
       fill two lines properly. */
    + `<div style="${F.body};color:var(--aira-text-secondary);`
    + `padding:12px 20px 16px;text-wrap:balance">${esc(m.body)}</div>`
    + `<div style="${row(8,'padding:12px 20px 16px;justify-content:flex-end;'
      + 'border-top:1px solid var(--aira-border-subtle)')}">`
    + b('Cancel', false, 'mcancel') + b(m.confirm, true, 'mconfirm') + `</div></div></div>`;
}

/* Bulk edit is the only place an OAuth key can actually be authored, because its
   value is a JSON object and a single-line field cannot hold one. It stays a
   short single form, which is what a modal is for. */
function bulkModal() {
  const ok = !S.bulkError;
  return `<div style="${row(0,'position:absolute;inset:0;justify-content:center;'
      + 'align-items:center;background:var(--aira-bg-scrim);z-index:8')}">`
    + `<div id="ctxmodal" role="dialog" aria-modal="true" aria-labelledby="btitle" `
    + `style="${col(0,'width:620px;background:var(--aira-bg-elevated);'
      + 'border-radius:var(--aira-radius-md);box-shadow:var(--aira-shadow-lg)')}">`
    + `<div style="${col(12,'padding:24px')}">`
    + `<div style="${row(12)}">`
    + `<h2 id="btitle" style="${F.h3};color:var(--aira-text-primary);flex:1;margin:0">`
    + `Bulk edit keys</h2>`
    + iconBtn('Close bulk edit', 'mcancel', I.x) + `</div>`
    + `<span style="${F.bodySm};color:var(--aira-text-secondary)">`
    + `A static key is a name and a value. An OAuth key is an object with a client id, `
    + `a client secret and a token URL.</span>`
    + `<div style="${col(4,'padding:12px;background:var(--aira-bg-subtle);'
      + 'border-radius:var(--aira-radius-md)')}">`
    + `<span style="${F.mono};color:var(--aira-text-secondary)">"REGION": "eu-central"</span>`
    + `<span style="${F.mono};color:var(--aira-text-secondary)">`
    + `"API": { "type": "OAUTH", "client_id": …, "client_secret": …, `
    + `"token_url": … }</span></div>`
    + `<div class="qwrap" style="${col(0,'border:1px solid '
      + (ok ? 'var(--aira-border-default)' : 'var(--aira-text-danger)') + ';'
      + 'border-radius:var(--aira-radius-md);overflow:hidden')}">`
    + `<textarea class="tbox" id="bulkbox" rows="9" aria-label="Keys as JSON" `
    + (ok ? '' : 'aria-invalid="true" aria-describedby="bulk-msg" ')
    + `style="${F.mono};color:var(--aira-text-primary);border:0;background:none;`
    + `padding:12px;min-height:200px;width:100%"` + live('bulkjson')
    + `>${esc(S.bulk)}</textarea></div>`
    + (S.bulkError
      ? `<span id="bulk-msg" role="alert" style="${row(8,F.bodySm
          + ';color:var(--aira-text-danger)')}">${I.circleAlert(16)}${esc(S.bulkError)}</span>`
      : '')
    + `</div>`
    + `<div style="${row(8,'padding:16px 24px;justify-content:flex-end;'
      + 'border-top:1px solid var(--aira-border-subtle)')}">`
    + ghostBtn('Cancel', 'mcancel')
    + primaryBtn('Save keys', 'bulksave', null, { disabled: !ok })
    + `</div></div></div>`;
}

/* ═══ toast ══════════════════════════════════════════════════════════════ */
const TONES = {
  success: { ink:'var(--aira-text-success)', mark:s => I.circleCheck(s) },
  info:    { ink:'var(--aira-text-link)',    mark:s => I.info(s) },
};
function toastEl() {
  if (!S.toast) return '';
  const t = S.toast, tone = TONES[t.tone || 'success'];
  return `<div role="status" aria-live="polite" style="${row(12,'position:absolute;'
      + 'left:112px;bottom:32px;max-width:440px;background:var(--aira-bg-elevated);'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
      + 'box-shadow:var(--aira-shadow-lg);padding:12px 16px;z-index:9')}">`
    + `<span aria-hidden="true" style="flex:none;display:flex;color:${tone.ink}">`
    + `${tone.mark(20)}</span>`
    + `<span style="${F.lblMd};color:var(--aira-text-primary);min-width:0;flex:1;`
    + `overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;`
    + `-webkit-box-orient:vertical;overflow:hidden">`
    + `${esc(t.title)}</span>`
    + (t.action
        ? `<button class="reset hov" style="${F.lblMd};color:var(--aira-text-link);`
          + `border-radius:var(--aira-radius-xs);padding:8px 12px;margin:-8px -8px -8px 4px"`
          + live('toastact') + `>${esc(t.action)}</button>`
        : '')
    + iconBtn('Dismiss', 'toastclose', I.x, 'var(--aira-text-tertiary)') + `</div>`;
}
let toastTimer = null, toastShown = null;
function armToast() {
  if (!S.toast) { clearTimeout(toastTimer); toastTimer = null; toastShown = null; return; }
  if (S.toast === toastShown) return;
  clearTimeout(toastTimer);
  toastShown = S.toast;
  toastTimer = setTimeout(() => {
    if (S.toast !== toastShown) return;
    S.toast = null; toastShown = null; commit();
  }, 4000);
}

/* ═══ render — one entry point, every mutation ends here ═════════════════ */
const appEl = document.getElementById('app');

function render() {
  captureScroll();
  captureCaret();
  appEl.innerHTML =
    `<div id="appmain" style="${row(0,'align-items:stretch;flex:1;min-width:0;height:100%;'
      + 'background:var(--aira-bg-canvas);overflow:hidden')}">`
    + railChrome()
    + `<div style="${col(0,'flex-grow:1;min-width:0')}">` + topBar()
    + `<div style="${col(0,'flex-grow:1;min-width:0;min-height:0;'
      + 'background:var(--aira-bg-elevated)')}">`
    + `<div style="${row(0,'height:60px;flex:none;padding:0 24px;'
      + 'border-bottom:1px solid var(--aira-border-default)')}">`
    + `<span style="${F.h3};color:var(--aira-text-primary)">Settings</span></div>`
    + `<div style="${row(0,'flex-grow:1;min-height:0;align-items:stretch')}">`
    + settingsNav()
    + `<div style="${col(0,'flex-grow:1;min-width:0;min-height:0')}">`
    + (S.page === 'whitelist' ? whitelistListing() : listing()) + `</div>`
    + `</div></div></div></div>`
    + (S.drawer && S.drawer.kind === 'wl' ? wlDrawer() : drawer())
    + modalEl() + toastEl();
  wireApp();
  applyInert();
  sizeGutters();     // before scroll restore: it changes the layout
  restoreScroll();   // scroll first: focus can scroll things into view
  placeDatePicker(); // after the scroll is restored, or it would be undone
  restoreFocus();
  restoreCaret();
  armToast();
  renderProto();
}

/* Everything behind the topmost surface goes inert, so Tab cannot walk into the
   listing behind a drawer or into the drawer's form behind a confirm. render()
   rebuilds innerHTML on every commit, so this is reapplied every time. */
function applyInert() {
  const main = document.getElementById('appmain');
  const dr = document.getElementById('ctxdrawer');
  const mo = document.getElementById('ctxmodal');
  if (main) main.inert = !!(S.drawer || S.modal);
  if (dr) dr.inert = !!S.modal;
  if (mo) mo.inert = false;
}
const topSurface = () => document.getElementById('ctxmodal')
                       || document.getElementById('ctxdrawer') || null;
const FOCUSABLE = 'button:not([disabled]),input,textarea,select,a[href],[tabindex]:not([tabindex="-1"])';

/* The panel re-renders on every keystroke, so the caret has to go back exactly
   where it was — restoring it to the end would break mid-word edits. */
let caret = null, caretId = null;
const FIELD_IDS = ['qbox','fname','fbody','bulkbox','kname','kval'];
function captureCaret() {
  const a = document.activeElement;
  if (a && FIELD_IDS.indexOf(a.id) >= 0) {
    caretId = a.id; caret = [a.selectionStart, a.selectionEnd];
  } else { caretId = null; caret = null; }
}
function restoreCaret() {
  if (!caretId) return;
  const el = document.getElementById(caretId);
  if (!el) { caretId = null; return; }
  try { el.focus(); if (caret) el.setSelectionRange(caret[0], caret[1]); } catch (e) {}
}

/* Scroll is owned by state and never read back off the DOM at render time. */
function captureScroll() {
  const w = document.getElementById('dscroll');
  if (w) S.drawerScroll = w.scrollTop;
}
function restoreScroll() {
  const w = document.getElementById('dscroll');
  if (!w) return;
  /* Clamp, or removing the last attachment parks the drawer in blank space. */
  S.drawerScroll = Math.max(0, Math.min(S.drawerScroll, w.scrollHeight - w.clientHeight));
  w.scrollTop = S.drawerScroll;
}

/* Focus never lands on <body>. After a control disappears — a row archived, a key
   deleted, a modal closed — focus moves to the thing that replaced it, and if
   that is gone too, to the first control of whatever surface is now on top. */
/* Every commit rebuilds the DOM, so focus has to be put back by hand — and a
   programmatic focus() makes Chrome show the keyboard ring even when the last
   thing the reader did was click. The ring belongs to keyboard navigation, so
   the modality is tracked and passed through: a click restores focus without
   it, Tab restores focus with it. */
let keyboardNav = false;
addEventListener('keydown', e => { if (e.key === 'Tab') keyboardNav = true; }, true);
addEventListener('pointerdown', () => { keyboardNav = false; }, true);
const putFocus = el => {
  try { el.focus({ preventScroll:false, focusVisible: keyboardNav }); }
  catch (e) { el.focus(); }
};
function restoreFocus() {
  if (caretId) return;                       // the caret path owns focus
  if (S.focus) {
    const el = appEl.querySelector(`[data-fk="${CSS.escape(S.focus)}"]`);
    if (el && !el.closest('[inert]')) { putFocus(el); S.focus = null; return; }
    S.focus = null;
  }
  const active = document.activeElement;
  if (active && active !== document.body && appEl.contains(active)
      && !active.closest('[inert]')) return;
  const top = topSurface();
  const scope = top || document.getElementById('appmain');
  const first = scope && scope.querySelector(FOCUSABLE);
  if (first) putFocus(first);
}

function wireApp() {
  appEl.querySelectorAll('[data-fk]').forEach(el => {
    const k = el.getAttribute('data-fk');
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.addEventListener('input', () => onInput(k, el.value));
      return;
    }
    el.addEventListener('click', e => { e.stopPropagation(); act(k); });
  });
}

function onInput(k, v) {
  if (k === 'q')     { S.query = v; S.menu = null; return commit(); }
  if (k === 'wlq')   { S.wlQuery = v; S.menu = null; return commit(); }
  if (k === 'wldomain')  { S.form.domain = v; return commit(); }
  if (k === 'wlremarks') { S.form.remarks = v; return commit(); }
  if (k === 'wlexpires') {
    /* The control speaks ISO; the row and the drawer speak the org's own date
       format, so both are kept — the ISO value is what the input reads back. */
    S.form.expiresISO = v;
    S.form.expires = v
      ? new Date(v + 'T00:00:00').toLocaleDateString('en-US',
          { month:'short', day:'numeric', year:'numeric' })
      : null;
    return commit();
  }
  if (k === 'dphm') {
    /* Typed freely and normalised on blur rather than while typing, so deleting
       a digit does not fight the field. */
    S.form.expiryHM = v; return commit();
  }
  if (k.indexOf('wlpath:') === 0) {
    S.form.paths[Number(k.split(':')[1])] = v; return commit();
  }
  if (k === 'fname') { S.form.name = v; return commit(); }
  if (k === 'fbody') { S.form.body = v; return commit(); }
  if (k === 'kname') { S.form.keys[S.keyEdit].name = v; return commit(); }
  if (k === 'kval')  { S.form.keys[S.keyEdit].pending = v; return commit(); }
  if (k === 'bulkjson') {
    S.bulk = v;
    /* Valid JSON that is not an object is a different mistake from JSON that does
       not parse, and telling someone to check their commas when their commas are
       fine sends them looking for a problem they do not have. */
    try {
      const p = JSON.parse(v);
      S.bulkError = (p === null || typeof p !== 'object' || Array.isArray(p))
        ? 'Keys must be a JSON object, not a list or a single value. Wrap them in { }.'
        : null;
    } catch (err) {
      S.bulkError = 'That is not valid JSON yet. Check the braces and commas.';
    }
    return commit();
  }
}

/* ═══ actions ════════════════════════════════════════════════════════════ */

function openDrawer(mode, id) {
  const src = id ? CX(id) : null;
  S.drawer = { mode, id: id || null };
  S.form = src ? clone(src) : mk({ name:'', scope: canEditOrg() ? 'org' : 'user',
                                   by:ME, date:NOW.date, time:NOW.time });
  S.pristine = clone(S.form);
  S.keysOpen = false; S.keyEdit = null; S.submitted = false;
  S.scanError = null; S.menu = null;
}
function closeDrawer() {
  S.drawer = null; S.form = null; S.pristine = null;
  S.keysOpen = false; S.keyEdit = null; S.submitted = false;
  S.scanError = null; S.bulk = null; S.bulkError = null; S.modal = null;
  if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
  S.scanning = false;
}

let scanTimer = null;
function startScan() {
  if (S.drawer.mode === 'add') {
    S.submitted = true;
    if (nameMissing()) { S.focus = 'fname'; return commit(); }
  }
  const willFail = S.failNext; S.failNext = false;
  S.scanning = true; S.scanError = null;
  commit();
  if (scanTimer) clearTimeout(scanTimer);
  /* The real scan runs 2–3 seconds. Kept honest rather than shortened, because
     the wait is part of what is being reviewed. */
  scanTimer = setTimeout(() => {
    scanTimer = null; S.scanning = false;
    if (willFail) { S.scanError = 'The scan could not finish'; S.focus = 'save'; return commit(); }
    const mode = S.drawer.mode, f = S.form;
    f.date = NOW.date; f.time = NOW.time; f.by = ME;
    f.keys.forEach(k => { delete k.pending; });
    if (mode === 'add') CTX.unshift(clone(f));
    else { const i = CTX.findIndex(c => c.id === f.id); if (i >= 0) CTX[i] = clone(f); }
    const name = f.name;
    closeDrawer();
    S.toast = { title: name + ' saved', tone:'success' };
    S.focus = 'add';
    commit();
  }, 2200);
}

function act(k) {
  const [head, a] = k.split(':');
  /* While a modal is up only its own controls act. */
  if (S.modal && ['mcancel','mconfirm','bulksave','bulkjson'].indexOf(head) < 0) return;

  switch (head) {
    case 'scope':
    case 'status':
      if (a === undefined) S.menu = S.menu === '__' + head ? null : '__' + head;
      else { S[head] = a; S.menu = null; }
      S.focus = head; return commit();
    case 'q':      return;
    case 'sort':   S.sort = S.sort === 'asc' ? 'desc' : 'asc';
                   S.focus = 'sort'; return commit();
    case 'wlq':    return;
    case 'nav':    S.page = a; S.menu = null; closeDrawer(); S.query = ''; S.wlQuery = '';
                   S.focus = 'nav:' + a; return commit();
    case 'wlstatus':
      if (a === undefined) S.menu = S.menu === '__wlstatus' ? null : '__wlstatus';
      else { S.wlStatus = a; S.menu = null; }
      S.focus = 'wlstatus'; return commit();
    case 'wladd':  wlOpen('add'); S.focus = 'wdomain'; return commit();
    case 'wlopen': wlOpen('view', a); S.focus = 'wlclose'; return commit();
    case 'wlmore': S.menu = S.menu === a ? null : a; S.focus = 'wlmore:' + a;
                   return commit();
    case 'wlmi':   return wlMenuItem(a, k.split(':')[2]);
    case 'wlclose': { const id = S.drawer && S.drawer.id;
                      closeDrawer(); S.focus = id ? 'wlmore:' + id : 'wladd';
                      return commit(); }
    case 'wledit': { const id = S.drawer.id; wlOpen('edit', id); S.focus = 'wdomain';
                     return commit(); }
    case 'wlpathadd':  S.form.paths.push(''); S.focus = 'wlpath:' + (S.form.paths.length - 1);
                       return commit();
    case 'wlpathdel':  S.form.paths.splice(Number(a), 1);
                       S.focus = 'wlpathadd'; return commit();
    case 'wlmethod': { const i = S.form.methods.indexOf(a);
                       if (i >= 0) S.form.methods.splice(i, 1);
                       else S.form.methods = WL_METHODS.filter(
                              m => m === a || S.form.methods.indexOf(m) >= 0);
                       S.focus = 'wlmethod:' + a; return commit(); }
    case 'wlactive':   S.form.active = !S.form.active; S.focus = 'wlactive';
                       return commit();
    case 'dptoggle':   S.dpOpen = !S.dpOpen; S.menu = null;
                       S.dpView = null; S.focus = 'dptoggle'; return commit();
    case 'dpclose':    if (S.dpOpen || S.menu) { S.dpOpen = false; S.menu = null;
                                                 return commit(); }
                       return;
    case 'dpprev':
    case 'dpnext': {
      const cur = S.dpView || (S.form.expires
        ? { y:new Date(S.form.expires).getFullYear(), m:new Date(S.form.expires).getMonth() }
        : { y:dpToday.getFullYear(), m:dpToday.getMonth() });
      const step = head === 'dpnext' ? 1 : -1;
      let m = cur.m + step, y = cur.y;
      if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; }
      S.dpView = { y, m }; S.focus = head; return commit();
    }
    case 'dpday': {
      const [y, m, d] = a.split('-').map(Number);
      S.form.expires = dpFmt(y, m, d);
      S.dpOpen = false; S.dpView = null; S.focus = 'dptoggle'; return commit();
    }
    case 'dptz':       if (a === undefined) S.menu = S.menu === '__dptz' ? null : '__dptz';
                       else { S.form.expiryTZ = a; S.menu = null; }
                       S.focus = 'dptz'; return commit();
    case 'dphm':       return;
    case 'dpclear':    S.form.expires = null; S.dpOpen = false; S.dpView = null;
                       S.focus = 'dptoggle'; return commit();
    case 'dptoday':    S.form.expires = dpFmt(dpToday.getFullYear(), dpToday.getMonth(),
                                              dpToday.getDate());
                       S.dpOpen = false; S.dpView = null; S.focus = 'dptoggle';
                       return commit();
    case 'wlsave':     return wlSave();
    case 'add':    openDrawer('add'); S.focus = 'fname'; return commit();
    /* Settings is a full surface in the real product, so its X returns to chat.
       There is no chat in this prototype, so it says so rather than doing
       nothing silently. */
    case 'closesettings':
      S.toast = { title:'Closing settings takes you back to the chat.', tone:'info' };
      return commit();
    case 'open':   openDrawer('view', a); S.focus = 'dclose'; return commit();
    case 'more':   S.menu = S.menu === a ? null : a; S.focus = 'more:' + a; return commit();
    case 'mi':     return menuItem(a, k.split(':')[2]);
    case 'scrim':  /* falls through — an outside click dismisses the drawer */
    case 'dclose': { const id = S.drawer && S.drawer.id;
                     closeDrawer(); S.focus = id ? 'more:' + id : 'add';
                     return commit(); }
    case 'dedit':  { const id = S.drawer.id; openDrawer('edit', id); S.focus = 'fname';
                     return commit(); }
    case 'fscope': if (a === undefined) S.menu = S.menu === '__fscope' ? null : '__fscope';
                   else { S.form.scope = a; S.menu = null; }
                   S.focus = 'fscope'; return commit();
    case 'save':   return startScan();
    case 'keys':   S.keysOpen = !S.keysOpen; S.keyEdit = null;
                   S.focus = 'keys'; return commit();
    case 'addkey': S.form.keys.push({ name:'NEW_KEY', type:'static' });
                   S.keyEdit = S.form.keys.length - 1; S.focus = 'kname';
                   return commit();
    case 'kedit':  S.keyEdit = Number(a); S.focus = 'kname'; return commit();
    /* ksave/kcancel carry no index, so the row has to be read off S.keyEdit
       before it is cleared — otherwise focus falls out of the keys block. */
    case 'ksave':
    case 'kcancel': { const i = S.keyEdit; S.keyEdit = null;
                      S.focus = i == null ? 'addkey' : 'kedit:' + i;
                      return commit(); }
    case 'kdel':   S.modal = { kind:'keydel', index:Number(a),
                               name:S.form.keys[Number(a)].name, from:'kdel:' + a };
                   return commit();
    case 'attdel': S.modal = { kind:'attdel', index:Number(a),
                               name:S.form.attachments[Number(a)].name, from:'attdel:' + a };
                   return commit();
    case 'attget': S.toast = { title: S.form.attachments[Number(a)].name + ' downloaded',
                               tone:'info' };
                   S.focus = 'attget:' + a; return commit();
    case 'attadd': S.form.attachments.push({ name:'tier_rules_2026.pdf', size:'240 KB' });
                   S.toast = { title:'tier_rules_2026.pdf attached', tone:'success' };
                   S.focus = 'attadd'; return commit();
    case 'bulk':   seedBulk(); S.focus = 'bulkjson'; return commit();
    case 'bulksave': {
      let parsed; try { parsed = JSON.parse(S.bulk); } catch (e) { return; }
      S.form.keys = Object.keys(parsed).map(name => {
        const v = parsed[name];
        const isOauth = v && typeof v === 'object' && String(v.type).toUpperCase() === 'OAUTH';
        return { name, type: isOauth ? 'oauth' : 'static' };
      });
      S.modal = null; S.bulk = null; S.bulkError = null;
      S.toast = { title:'Keys updated', tone:'success' };
      S.focus = 'bulk'; return commit();
    }
    case 'mcancel': { const from = S.modal && S.modal.from;
                      const wasBulk = S.modal && S.modal.kind === 'bulk';
                      S.modal = null; S.bulk = null; S.bulkError = null;
                      S.focus = from || (wasBulk ? 'bulk' : null); return commit(); }
    case 'mconfirm': return modalConfirm();
    case 'toastclose':
    case 'toastact': {
      /* A button labelled with a verb has to perform it. */
      const u = S.toast && S.toast.undo && CX(S.toast.undo);
      if (u) u.archived = false;
      S.toast = null; return commit();
    }
  }
}

function menuItem(action, id) {
  const c = CX(id);
  S.menu = null;
  if (action === 'view')      { openDrawer('view', id); S.focus = 'dclose'; return commit(); }
  if (action === 'edit')      { openDrawer('edit', id); S.focus = 'fname'; return commit(); }
  if (action === 'archive') { S.modal = { kind:'archive', id, from:'more:' + id };
                              return commit(); }
  if (action === 'restore') { S.modal = { kind:'restore', id, from:'more:' + id };
                              return commit(); }
}

function wlMenuItem(action, id) {
  S.menu = null;
  if (action === 'view')   { wlOpen('view', id); S.focus = 'wlclose'; return commit(); }
  if (action === 'edit')   { wlOpen('edit', id); S.focus = 'wdomain'; return commit(); }
  if (action === 'delete') { S.modal = { kind:'wldel', id, from:'wlmore:' + id };
                             return commit(); }
}

function wlSave() {
  S.submitted = true;
  const e = wlErrors();
  if (e.domain)  { S.focus = 'wldomain'; return commit(); }
  if (e.paths)   { S.focus = 'wlpath:0'; return commit(); }
  if (e.methods) { S.focus = 'wlmethod:GET'; return commit(); }
  const w = S.form;
  w.paths = w.paths.filter(x => x.trim());
  w.by = ME; w.date = NOW.date; w.time = NOW.time;
  const adding = S.drawer.mode === 'add';
  if (adding) WL.unshift(clone(w));
  else Object.assign(WX(w.id), clone(w));
  const domain = w.domain;
  closeDrawer();
  S.toast = { title: domain + (adding ? ' whitelisted' : ' updated'), tone:'success' };
  S.focus = 'wladd';
  return commit();
}

function modalConfirm() {
  const m = S.modal; S.modal = null;
  if (m.kind === 'archive') {
    const c = CX(m.id); c.archived = true;
    S.toast = { title: c.name + ' archived', tone:'success',
                action:'Undo', undo:c.id };
    S.focus = 'add'; return commit();
  }
  if (m.kind === 'restore') {
    const c = CX(m.id); c.archived = false;
    S.toast = { title: c.name + ' restored', tone:'success' };
    S.focus = 'add'; return commit();
  }
  if (m.kind === 'attdel') {
    S.form.attachments.splice(m.index, 1);
    S.focus = S.form.attachments.length ? 'attget:0' : 'attadd'; return commit();
  }
  if (m.kind === 'wldel') {
    const w = WX(m.id), domain = w.domain;
    WL = WL.filter(x => x.id !== m.id);
    S.toast = { title: domain + ' deleted', tone:'success' };
    S.focus = 'wladd'; return commit();
  }
  if (m.kind === 'keydel') {
    S.form.keys.splice(m.index, 1);
    if (S.keyEdit === m.index) S.keyEdit = null;
    S.focus = S.form.keys.length ? 'kedit:0' : 'addkey'; return commit();
  }
  return commit();
}

function seedBulk() {
  S.bulk = JSON.stringify(S.form.keys.reduce((o, kk) => {
    o[kk.name] = kk.type === 'oauth'
      ? { type:'OAUTH', client_id:'trendly-aira',
          client_secret:'••••••••',
          token_url:'https://api.eucrm.cc.capillarytech.com/oauth/token' }
      : '';
    return o;
  }, {}), null, 2);
  S.bulkError = null; S.modal = { kind:'bulk', from:'bulk' };
}

function commit() { render(); }

/* Clicking the surface closes any open menu, the way a popover behaves. */
appEl.addEventListener('click', () => {
  if (S.modal || S.drawer) return;      // those have their own dismissal
  if (S.menu) { S.menu = null; commit(); }
});

/* ═══ keyboard ═══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal)  { e.preventDefault(); return act('mcancel'); }
    if (S.menu)   { e.preventDefault(); S.menu = null; return commit(); }
    if (S.dpOpen) { e.preventDefault(); S.dpOpen = false; return commit(); }
    if (S.drawer) { e.preventDefault(); return act('dclose'); }
    if (S.toast)  { e.preventDefault(); S.toast = null; return commit(); }
    return;
  }
  /* An open listbox owes the reader arrow keys. Enter and Space already work
     because every option is a real button. */
  if (S.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const list = document.querySelector('.menu');
    if (list) {
      const opts = Array.from(list.querySelectorAll('button'));
      if (opts.length) {
        e.preventDefault();
        const at = opts.indexOf(document.activeElement);
        const step = e.key === 'ArrowDown' ? 1 : -1;
        const next = at < 0 ? (step > 0 ? 0 : opts.length - 1)
                            : (at + step + opts.length) % opts.length;
        opts[next].focus();
        return;
      }
    }
  }
  /* Enter and Space operate a focused control; the browser does this for real
     buttons, and every control here is one. Tab is the only key that needs
     help, because focus has to stay inside the topmost surface. */
  if (e.key !== 'Tab') return;
  const top = topSurface();
  if (!top) return;
  const items = Array.from(top.querySelectorAll(FOCUSABLE))
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});

/* ═══ prototype controls ═════════════════════════════════════════════════
   Not part of the product. These carry the three states a reviewer cannot
   reach by clicking: a different role, a scan that fails, and an org with
   nothing in it yet. ──────────────────────────────────────────────────── */
const protoEl = document.getElementById('proto');
function renderProto() {
  const b = (label, key, pressed) =>
    `<button type="button" data-p="${key}" aria-pressed="${!!pressed}">${esc(label)}</button>`;
  /* Two of these change nothing you can see on the listing — a member reads the
     same rows, and an armed failure only shows up three clicks later inside the
     drawer. So the panel says out loud what it has just armed, and every button
     has a visible consequence at the moment it is pressed. */
  const wl = S.page === 'whitelist';
  /* A drawer runs the full height of the window, so at the top edge the strip
     lands on the drawer's own title. While one is open it centres on the app
     left of the drawer instead. */
  protoEl.style.left = S.drawer
    ? `calc((100% - min(${DRAWER_W}px, 100%)) / 2)` : '50%';
  protoEl.innerHTML = `<span class="plabel">Prototype</span>`
    + (wl ? b('Empty the list', 'empty', WL.length === 0)
          : b('Empty the org', 'empty', CTX.length === 0))
    + b('Reset', 'reset', false);
  protoEl.querySelectorAll('[data-p]').forEach(el =>
    el.onclick = () => protoAct(el.getAttribute('data-p')));
}
function protoAct(k) {
  const [head, a] = k.split(':');
  if (head === 'role')     { S.role = a; S.scope = 'all'; S.menu = null; closeDrawer(); }
  if (head === 'failnext') { S.failNext = !S.failNext; }
  if (head === 'empty') {
    if (S.page === 'whitelist') { WL = WL.length ? [] : clone(WL_SEED); S.wlQuery = ''; }
    else                        { CTX = CTX.length ? [] : clone(SEED); S.query = ''; }
    S.menu = null; closeDrawer();
  }
  if (head === 'reset')    { resetAll(); }
  S.focus = null; commit();
}
function resetAll() {
  CTX = clone(SEED); WL = clone(WL_SEED);
  S.role = 'superadmin'; S.scope = 'all'; S.status = 'active'; S.query = '';
  S.wlStatus = 'all'; S.wlQuery = ''; S.sort = 'desc';
  S.menu = null; S.failNext = false; S.toast = null; S.focus = null;
  closeDrawer();
  clearTimeout(toastTimer); toastTimer = null; toastShown = null;
}

try {
  render();
} catch (err) {
  appEl.innerHTML =
    '<div style="margin:auto;max-width:520px;padding:24px;'
    + 'border:1px solid var(--aira-border-default);'
    + 'border-radius:var(--aira-radius-lg);background:var(--aira-bg-elevated);'
    + 'font:400 14px/20px Roboto,system-ui,sans-serif;'
    + 'color:var(--aira-text-secondary)">'
    + '<b style="display:block;margin-bottom:8px;font:600 16px/24px Roboto,system-ui,sans-serif;'
    + 'color:#111827">This prototype could not start</b>'
    + 'It needs to run as a real page. If you opened the file in a preview or snapshot '
    + 'viewer, scripts are disabled there — open it in a browser instead.'
    + '<div style="margin-top:12px;font:400 13px/20px ui-monospace,Menlo,monospace;'
    + 'color:#D92D2D">' + String(err && err.message ? err.message : err) + '</div></div>';
}
</script>
</body>
